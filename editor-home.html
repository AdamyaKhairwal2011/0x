<style>
  .logo {
    font-family: 'Geist Pixel', monospace;
    margin: 20px;
    font-size: 20px;
  }
:root{--bg:#fafafa;--side:#f4f4f4;--line:#e8e8e8;--hover:#ebebeb;--sel:#e4e4e4;--tx:#1d1d1f;--mut:#8a8a8e;--card:#fff;--acc:#111;
--k:#a626a4;--s:#50a14f;--n:#b76b01;--c:#9a9aa0;--f:#4078f2;--t:#c18401;--err:#d93025;--warn:#b06000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#161616;--side:#1c1c1c;--line:#2a2a2a;--hover:#262626;--sel:#2e2e2e;--tx:#ececec;--mut:#8a8a8e;--card:#202020;--acc:#f2f2f2;--k:#d58ef0;--s:#8fd18b;--n:#e5b062;--c:#6e6e74;--f:#7fa6ff;--t:#e5c07b;--err:#ff6b63;--warn:#e5b062}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13.5px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;height:100%}
#side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .25s ease;flex:none}

.nav{padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;color:var(--tx)}
.item:hover{background:var(--hover)}.item.on{background:var(--sel)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;color:var(--mut);font-size:12.5px}

#q{margin:2px 8px 6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:none;display:none}
#tree{flex:1;overflow:auto;padding:0 8px 8px}
.row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;user-select:none}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row span{overflow:hidden;text-overflow:ellipsis}
.row .ch{transition:transform .15s;width:12px;height:12px;color:var(--mut)}.row.open .ch{transform:rotate(90deg)}
.row svg:not(.ch){color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);margin-left:auto;flex:none}
.foot{margin:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--mut)}
.foot b{font-weight:500;display:flex;justify-content:space-between}
.foot button{margin-top:8px;width:100%;padding:7px;border-radius:8px;background:var(--hover);color:var(--tx);font-weight:500}
.user{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);color:var(--tx)}
.av{width:26px;height:26px;border-radius:50%;background:var(--sel);display:grid;place-items:center;color:var(--mut);font-size:12px}
.user button{margin-left:auto;color:var(--mut)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;height:40px;padding:0 10px;gap:4px;color:var(--mut)}
#top button{padding:6px;border-radius:7px}#top button:hover{background:var(--hover);color:var(--tx)}
#tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;gap:2px}
.tab{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 12px;border-radius:8px;color:var(--mut);white-space:nowrap;cursor:pointer}
.tab:hover{background:var(--hover)}.tab.on{background:var(--sel);color:var(--tx)}
.tab i{font-style:normal;width:16px;height:16px;display:grid;place-items:center;border-radius:5px;font-size:15px;line-height:1}
.tab i:hover{background:var(--line)}
#ed{flex:1;min-height:0;position:relative;display:none;border-top:1px solid var(--line)}
#gut{position:absolute;left:0;top:0;bottom:0;width:56px;overflow:hidden;color:var(--mut);text-align:right;padding:12px 12px 0 0;font:12.5px/20px ui-monospace,"SF Mono",Menlo,Consolas,monospace;user-select:none;opacity:.7}
#gut div{will-change:transform}
.code{position:absolute;left:56px;right:0;top:0;bottom:0;margin:0;padding:12px 16px 40px 8px;font:12.5px/20px ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre;tab-size:2;overflow:auto;border:0;outline:none;letter-spacing:0;word-spacing:0}
#hl{pointer-events:none;overflow:hidden;color:var(--tx)}
#ta{background:transparent;color:transparent;caret-color:var(--acc);resize:none;-webkit-text-fill-color:transparent;overflow:auto}
#ta::selection{background:rgba(120,150,255,.3);-webkit-text-fill-color:transparent}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-selector-tag,.hljs-meta .hljs-keyword{color:var(--k)}
.hljs-string,.hljs-regexp,.hljs-attr+.hljs-string{color:var(--s)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--n)}
.hljs-comment,.hljs-quote{color:var(--c);font-style:italic}
.hljs-title,.hljs-function,.hljs-section{color:var(--f)}
.hljs-attr,.hljs-attribute,.hljs-name,.hljs-type,.hljs-class .hljs-title,.hljs-variable,.hljs-property{color:var(--t)}
#status{display:none;align-items:center;gap:16px;height:28px;padding:0 14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
#status .sp{flex:1}#status button{color:var(--mut);padding:2px 8px;border-radius:6px}#status button:hover{background:var(--hover);color:var(--tx)}
#empty{position:absolute;inset:40px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.pick{display:flex;gap:10px;font-size:34px; font-family:'public sans', sans}.pick .user_name{color:var(--acc); font-family: 'geist pixel'}
.box{width:min(640px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .2s}
.box.drag{border-color:var(--acc)}
.box p{margin:0 0 30px;color:var(--mut);font-size:15px}
.box .bar{display:flex;align-items:center;gap:10px;color:var(--mut)}
.plus{width:32px;height:32px;border-radius:50%;background:var(--hover);display:grid;place-items:center}
.go{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center}
.chips{display:flex;gap:8px;width:min(640px,100%)}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mut)}.chip:hover{background:var(--hover);color:var(--tx)}
.hint{position:absolute;bottom:22px;color:var(--mut);font-size:12.5px;text-align:center}

#img{position:absolute;inset:41px 0 28px 0;display:none;place-items:center;overflow:auto;padding:20px}#img img{max-width:100%;max-height:100%;border-radius:8px}
#top #bRun{display:none;align-items:center;gap:7px;padding:5px 13px;border-radius:8px;background:var(--acc);color:var(--bg);font-weight:500;margin-left:6px}
#top #bRun:hover{background:var(--acc);color:var(--bg);opacity:.85}#bRun:disabled{opacity:.7;cursor:default}
#bRun .spin b{background:var(--bg)}
#cons{display:none;flex-direction:column;height:210px;flex:none;border-top:1px solid var(--line);background:var(--side)}
#cons .ch{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--mut);font-size:12px}
#cons .ch b{font-weight:500;color:var(--tx)}#cons .ch .sp{flex:1}#cons .ch button{padding:2px 8px;border-radius:6px;color:var(--mut)}#cons .ch button:hover{background:var(--hover);color:var(--tx)}
#cout{flex:1;overflow:auto;padding:0 14px 10px;font:12.5px/19px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#cout .l{white-space:pre-wrap;word-break:break-word}.l.err{color:var(--err)}.l.warn{color:var(--warn)}.l.mut{color:var(--mut)}
#prev{width:46%;min-width:300px;max-width:760px;border-left:1px solid var(--line);background:var(--side);display:none;flex-direction:column;flex:none}
#prev.on{display:flex}
#prev .ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 14px;color:var(--mut)}
#prev .ph button{padding:5px;border-radius:7px;font-size:17px;line-height:1}#prev .ph button:hover{background:var(--hover);color:var(--tx)}
.pw{flex:1;position:relative;margin:0 8px 8px;min-height:0}
.pw iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
#pl{position:absolute;left:50%;top:50%;margin:-14px 0 0 -14px;display:none}
@media(max-width:700px){#prev{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:none;z-index:6}}
/* Apple-style loader */
.spin{position:relative;width:var(--s,20px);height:var(--s,20px);flex:none}
.spin b{position:absolute;left:46%;top:0;width:8%;height:26%;border-radius:99px;background:var(--mut);transform-origin:50% 190%;opacity:0;animation:fd 1s linear infinite}
@keyframes fd{0%{opacity:1}100%{opacity:.08}}
#splash,#busy{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;transition:opacity .45s}
#busy{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);opacity:0;pointer-events:none}
#busy.on{opacity:1;pointer-events:auto}
#busy div{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--mut)}
#toast{position:fixed;bottom:44px;left:50%;transform:translate(-50%,20px);background:var(--acc);color:var(--bg);padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){#side{position:absolute;z-index:5;height:100%;box-shadow:4px 0 20px rgba(0,0,0,.1)}}
#med{position:absolute;inset:41px 0 28px 0;display:none;place-items:center;padding:20px;overflow:auto}#med video{max-width:100%;max-height:100%;border-radius:8px}#med audio{width:min(480px,100%)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:20}.ov.top{place-items:start center;padding-top:12vh}
.dlg,.pal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);width:min(420px,92vw);padding:18px}
.dlg h3{margin:0 0 10px;font-weight:600;font-size:15px}.dlg p{margin:0 0 12px;color:var(--mut)}
.dlg label{display:block;color:var(--mut);font-size:12px;margin-bottom:10px}
.dlg input,.pal input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;outline:none}
.dlg input:focus,.pal input:focus{border-color:var(--acc)}
.bt{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.bt button{padding:7px 14px;border-radius:8px;background:var(--hover)}.bt .ok{background:var(--acc);color:var(--bg);font-weight:500}.bt .ok.danger{background:var(--err);color:#fff}
.pal{width:min(560px,94vw);padding:10px}.pal input{margin:0 0 8px}.pl{max-height:50vh;overflow:auto}
.pi{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:8px;cursor:pointer}.pi.on{background:var(--sel)}.pi em{font-style:normal;color:var(--mut);font-size:12px}.pi.mut{color:var(--mut)}
#cm{position:fixed;z-index:30;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#cm button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:6px}#cm button:hover{background:var(--hover)}#cm .danger{color:var(--err)}#cm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.row .mx{margin-left:auto;opacity:0;padding:0 5px;border-radius:5px;color:var(--mut);line-height:1.2}.dot+.mx{margin-left:6px}.row:hover .mx,.row.on .mx{opacity:1}.mx:hover{background:var(--line)}
.row.dt{background:var(--sel);outline:1px dashed var(--mut)}#tree.dt{outline:1px dashed var(--mut);outline-offset:-4px}
#top #bPal{font-size:12.5px;padding:5px 10px;white-space:nowrap}
</style></head>
<body>

 <div class="nav">

 </div>

 <div id="top">

<script>
    if (!window.localStorage.getItem("vcloud_user")) {
        window.location.href = "onboard.html";
    }
document.querySelector(".user_name").textContent = localStorage.getItem("vcloud_username") || "User";
const $=id=>document.getElementById(id);
document.querySelectorAll('.spin').forEach(s=>{for(let i=0;i<12;i++){const b=document.createElement('b');b.style.transform=`rotate(${i*30}deg)`;b.style.animationDelay=`${-1+i/12}s`;s.appendChild(b)}});
const ic={dir:'<svg viewBox="0 0 16 16"><path d="M2 4.500A1.500 1.500 0 0 1 3.500 3h3L8 4.500h4.500A1.500 1.500 0 0 1 14 6v5.500a1.500 1.500 0 0 1-1.500 1.500h-9A1.500 1.500 0 0 1 2 11.500z"/></svg>',file:'<svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>',ch:'<svg class="ch" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>'};
const LANG={js:'javascript',mjs:'javascript',cjs:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',py:'python',html:'xml',htm:'xml',xml:'xml',svg:'xml',vue:'xml',css:'css',scss:'scss',less:'less',json:'json',md:'markdown',yml:'yaml',yaml:'yaml',sh:'bash',bash:'bash',zsh:'bash',java:'java',c:'c',h:'c',cpp:'cpp',hpp:'cpp',cs:'csharp',go:'go',rs:'rust',rb:'ruby',php:'php',sql:'sql',swift:'swift',kt:'kotlin',lua:'lua',r:'r',toml:'ini',ini:'ini',dockerfile:'dockerfile',diff:'diff',txt:'plaintext'};
const IMG=['png','jpg','jpeg','gif','webp','svg','ico','bmp','avif'];
const BIN=['zip','gz','tar','exe','dll','so','pdf','mp4','mov','mp3','wav','woff','woff2','ttf','otf','bin','class','jar','pyc','db','sqlite'];
const ext=n=>{const e=n.split('.').pop().toLowerCase();return n.includes('.')?e:n.toLowerCase()};
let pmap=new Map(),root=null,files=[],tabs=[],cur=null,filter='';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)};
const busy=async(m,fn)=>{$('busyt').textContent=m;$('busy').classList.add('on');await new Promise(r=>setTimeout(r,30));try{return await fn()}finally{$('busy').classList.remove('on')}};
setTimeout(()=>{$('splash').style.opacity=0;setTimeout(()=>$('splash').remove(),500)},650);

/* ---------- tree ---------- */
function build(list){const r={name:'',dirs:{},files:[],open:true};
 for(const f of list){const p=(f.webkitRelativePath||f.name).split('/');if(f.webkitRelativePath)p.shift();let n=r;
  for(let i=0;i<p.length-1;i++){n=n.dirs[p[i]]??=(({name:p[i],dirs:{},files:[],open:false}))}
  n.files.push({name:p[p.length-1],file:f,path:(f.webkitRelativePath||f.name)})}
 return r}
function match(n){if(!filter)return true;return n.files.some(f=>f.name.toLowerCase().includes(filter))||Object.values(n.dirs).some(match)}
function render(){const t=$('tree');t.innerHTML='';if(!root)return;
 const walk=(n,box,d)=>{
  Object.values(n.dirs).sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{if(!match(c))return;
   const r=document.createElement('div');r.className='row'+(c.open||filter?' open':'');r.style.paddingLeft=8+d*14+'px';r.innerHTML=ic.ch+ic.dir+`<span>${esc(c.name)}</span>`;
   r.onclick=()=>{c.open=!c.open;render()};box.appendChild(r);if(c.open||filter)walk(c,box,d+1)});
  n.files.filter(f=>!filter||f.name.toLowerCase().includes(filter)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{

(()=>{

const GROQ_KEYS=[
 "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",
 "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", /* key 2 */

/* ---------------- Tijori vault ---------------- */
let sb=null;
const loadLib=()=>new Promise((ok,no)=>{if(window.supabase)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(Error('Could not load Supabase (network blocked?)'));document.head.appendChild(s)});

async function vaultId(){let id=lsGet('vcloud_user');if(id)return id;

 if(!r||!r.id.trim())throw Error('Vault ID required');lsSet('vcloud_user',r.id.trim());return r.id.trim()}
async function fetchAll(){const id=await vaultId(),c=await client();
 const{data,error}=await c.from(TABLE).select('data').eq('id',id).maybeSingle();if(error)throw error;
 if(!data||!data.data)return[];let p;try{p=JSON.parse(data.data)}catch(e){throw Error('Vault data unreadable; refusing to overwrite')}
 return Array.isArray(p)?p:[]}
async function mutate(fn){const list=await fetchAll(),out=fn(list),c=await client();
 const{error}=await c.from(TABLE).upsert({id:await vaultId(),data:JSON.stringify(out)},{onConflict:'id'});if(error)throw error;return out}
const kid=(e,i)=>e.id||'i'+i;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&3|8).toString(16)});

function modal(title){const o=document.createElement('div');o.className='mdl';
 o.innerHTML=`<div class="mc"><div class="mh"><b>${esc(title)}</b><button class="x" title="Close">×</button></div><div class="mb"></div></div>`;document.body.appendChild(o);
 const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}},close=()=>{o.remove();document.removeEventListener('keydown',k,true)};
 document.addEventListener('keydown',k,true);o.onmousedown=e=>{if(e.target===o)close()};o.querySelector('.x').onclick=close;return{body:o.querySelector('.mb'),close}}

async function openSecrets(){
 const m=modal('Tijori · Secrets');let list=[],edit=null,shown=new Set(),err='',loading=true;
 m.body.innerHTML='<div class="er" id="vE"></div><div id="vL" style="display:flex;flex-direction:column;gap:8px"></div><div class="add"><input id="vA" placeholder="Label (e.g. API_KEY)" maxlength="120" autocomplete="off" spellcheck="false"><textarea id="vD" placeholder="Value" spellcheck="false"></textarea><button class="pri" id="vS" disabled>Save to Tijori</button></div>';
 const L=m.body.querySelector('#vL'),E=m.body.querySelector('#vE'),A=m.body.querySelector('#vA'),D=m.body.querySelector('#vD'),S=m.body.querySelector('#vS');
 const draw=()=>{E.textContent=err;
  if(loading){L.innerHTML='<div class="em">Loading…</div>';return}
  if(!list.length){L.innerHTML='<div class="em">No secrets yet. Add one below.</div>';return}
  L.innerHTML=list.map((e,i)=>{const k=kid(e,i);
   if(edit===k)return`<div class="sr" data-k="${esc(k)}"><input class="el" value="${esc(e.label)}" maxlength="120"><textarea class="ed" style="margin-top:6px">${esc(e.data)}</textarea><div class="ac"><button data-a="ok">Save</button><button data-a="no">Cancel</button></div></div>`;
   return`<div class="sr" data-k="${esc(k)}"><b>${esc(e.label)}</b><div class="v">${shown.has(k)?esc(e.data):'•'.repeat(Math.min(24,e.data.length))}</div><div class="ac"><button data-a="show">${shown.has(k)?'Hide':'Show'}</button><button data-a="cp">Copy</button><button data-a="ed">Edit</button><button class="dg" data-a="del">Delete</button></div></div>`}).join('')};
 const run=async(fn,msg)=>{try{list=await mutate(fn);edit=null;err='';msg&&toast(msg)}catch(e){err=e.message;toast('Failed: '+e.message)}draw()};
 const find=(l,k)=>l.findIndex((e,i)=>kid(e,i)===k);
 L.onclick=async ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const row=b.closest('.sr'),k=row.dataset.k,i=find(list,k),e=list[i],a=b.dataset.a;
  if(a==='show'){shown.has(k)?shown.delete(k):shown.add(k);draw()}
  else if(a==='cp')copyTxt(e.data);
  else if(a==='ed'){edit=k;draw()}
  else if(a==='no'){edit=null;draw()}
  else if(a==='ok'){const l=row.querySelector('.el').value.trim(),d=row.querySelector('.ed').value.trim();if(!l||!d)return toast('Label and data are required');
   run(x=>{const j=find(x,k);if(j<0)throw Error('Entry no longer exists');x[j]={...x[j],label:l,data:d,ts:Date.now(),id:x[j].id||uuid()};return x},'Updated')}
  else if(a==='del'){if(await dlg({title:'Delete secret?',msg:'"'+e.label+'" will be permanently removed.',ok:'Delete',danger:1}))run(x=>{const j=find(x,k);if(j<0)throw Error('Entry no longer exists');x.splice(j,1);return x},'Deleted')}};
 const chk=()=>S.disabled=!A.value.trim()||!D.value.trim();A.oninput=D.oninput=chk;
 S.onclick=async()=>{const l=A.value.trim(),d=D.value.trim();if(!l||!d)return;S.disabled=true;
  await run(x=>{x.unshift({label:l,data:d,ts:Date.now(),id:uuid()});return x},'Saved "'+l+'"');if(!err){A.value=D.value='';}chk()};
 draw();try{list=await fetchAll()}catch(e){err=e.message}loading=false;draw()}

/* quick-pick: insert secret at caret */
async function pickSecret(s,e){const ta=$$('ta');if(!cur||cur.kind!=='txt')return toast('Open a text file first');
 const o=document.createElement('div');o.className='mdl top';o.innerHTML='<div class="qp"><input placeholder="Select a secret to insert…" spellcheck="false"><div class="ql"><div class="qi mut">Loading…</div></div></div>';document.body.appendChild(o);
 const inp=o.querySelector('input'),ql=o.querySelector('.ql');let items=[],view=[],ix=0;
 const close=()=>{o.remove();ta.focus()};
 const draw=()=>{const q=inp.value.toLowerCase();view=items.filter(x=>x.label.toLowerCase().includes(q));ix=Math.min(ix,Math.max(0,view.length-1));
  ql.innerHTML=view.map((x,i)=>`<div class="qi${i===ix?' on':''}" data-i="${i}"><span>${esc(x.label)}</span><em>${x.data.length} chars</em></div>`).join('')||'<div class="qi mut">No matching secrets</div>';
  const a=ql.querySelector('.on');a&&a.scrollIntoView({block:'nearest'})};
 const pick=x=>{if(!x)return;close();rep(s,e,x.data);const p=s+x.data.length;ta.setSelectionRange(p,p);toast('Inserted '+x.label)};
 inp.oninput=()=>{ix=0;draw()};
 inp.onkeydown=ev=>{const n=view.length||1;if(ev.key==='ArrowDown'){ev.preventDefault();ix=(ix+1)%n;draw()}else if(ev.key==='ArrowUp'){ev.preventDefault();ix=(ix-1+n)%n;draw()}else if(ev.key==='Enter'){ev.preventDefault();pick(view[ix])}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();close()}};
 ql.onclick=ev=>{const i=ev.target.closest('.qi[data-i]');i&&pick(view[i.dataset.i])};o.onmousedown=ev=>{if(ev.target===o)close()};inp.focus();
 try{items=await fetchAll();draw()}catch(er){ql.innerHTML=`<div class="qi mut">${esc(er.message)}</div>`}}

/* ---------------- AI chat (Groq, key rotation) ---------------- */
let kIdx=0;const cool=new Map();
const fatal=m=>Object.assign(Error(m),{fatal:true});
async function groq(messages,onTok,signal){
 const keys=GROQ_KEYS.filter(k=>/^gsk_/.test(k));if(!keys.length)throw fatal('No Groq API keys configured');
 let last=null,tried=0;
 for(let n=0;n<keys.length;n++){const i=(kIdx+n)%keys.length,k=keys[i];if((cool.get(k)||0)>Date.now())continue;tried++;let started=false;
  try{
   const r=await fetch(GROQ_URL,{method:'POST',signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},body:JSON.stringify({model:MODEL,messages,stream:true,temperature:.6,max_tokens:512})});
   if(!r.ok){let msg='';try{msg=(await r.json()).error.message}catch(e){}
    if(r.status===400||r.status===413||r.status===422)throw fatal('Request rejected: '+(msg||r.status));
    cool.set(k,Date.now()+(r.status===429?(+r.headers.get('retry-after')||60)*1000:r.status===401||r.status===403?36e5:15e3));
    last=Error('Key #'+(i+1)+' failed ('+r.status+(msg?': '+msg:'')+')');continue}
   const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]'){kIdx=i;return}
     try{const t=JSON.parse(d).choices[0].delta.content;if(t){started=true;onTok(t)}}catch(e){}}}
   kIdx=i;return;
  }catch(e){if(e.name==='AbortError'||e.fatal||started)throw e;cool.set(k,Date.now()+5e3);last=e}}
 throw last||Error('All API keys are cooling down. Try again in a minute.')}

let chats=[],active=null,view='chat',busy=false,ctl=null,raf2=0;
try{chats=JSON.parse(lsGet('vk_chats')||'[]');if(!Array.isArray(chats))chats=[]}catch(e){chats=[]}
active=lsGet('vk_chat_active');
const saveChats=()=>{chats=chats.slice(0,50);lsSet('vk_chats',JSON.stringify(chats));lsSet('vk_chat_active',active||'')};
const getChat=()=>chats.find(c=>c.id===active);
function newChat(){const c={id:uuid(),title:'New chat',ts:Date.now(),msgs:[]};chats.unshift(c);active=c.id;view='chat';saveChats();return c}

const P=document.createElement('div');P.id='aichat';
P.innerHTML='<div class="aih"><b id="aiT">Chat</b><button id="aiL" title="All chats">☰</button><button id="aiN" title="New chat">＋</button><button id="aiX" title="Hide (chat is kept)">–</button></div><div id="aiB"></div><div class="aiin" id="aiF"><textarea id="aiI" rows="1" placeholder="Message AI…  (Enter to send)"></textarea><button id="aiS" title="Send">↑</button></div>';
document.body.appendChild(P);
const aiB=$$('aiB'),aiI=$$('aiI');
const showPanel=()=>{P.classList.add('on')},hidePanel=()=>P.classList.remove('on');

function md(t){const parts=String(t).split(/```/);return parts.map((p,i)=>{
 if(i%2){const nl=p.indexOf('\n'),code=nl>=0&&/^[\w+#.-]*$/.test(p.slice(0,nl).trim())?p.slice(nl+1):p;return`<pre><button class="cp">Copy</button><code>${esc(code.replace(/\n$/,''))}</code></pre>`}
 return p.trim()?`<p>${esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</p>`:''}).join('')}

function renderBody(){
 const c=getChat();$$('aiT').textContent=view==='list'?'Chats':(c?c.title:'Chat');$$('aiF').style.display=view==='list'?'none':'flex';
 const S=$$('aiS');S.textContent=busy?'■':'↑';S.title=busy?'Stop':'Send';
 if(view==='list'){aiB.innerHTML=chats.length?chats.map(x=>`<div class="cl" data-id="${x.id}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}<br><em>${new Date(x.ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</em></span><button data-del="${x.id}" title="Delete">×</button></div>`).join(''):'<div class="em">No chats yet. Start one below or from the home screen.</div>';return}
 if(!c||!c.msgs.length){aiB.innerHTML='<div class="em">Ask anything. Right-click code in the editor to ask about it.</div>';return}
 aiB.innerHTML=c.msgs.map((m,i)=>`<div class="am ${m.role}">${md(m.content)}${m.err?`<div class="er">${esc(m.err)}</div>`:''}${busy&&i===c.msgs.length-1&&!m.content?'<span style="color:var(--mut)">Thinking…</span>':''}</div>`).join('');
 aiB.scrollTop=aiB.scrollHeight}
const sched=()=>{cancelAnimationFrame(raf2);raf2=requestAnimationFrame(renderBody)};

async function send(text,ctx){text=(text||'').trim();if(!text||busy)return;
 let c=getChat();if(!c)c=newChat();view='chat';
 c.msgs.push({role:'user',content:ctx?text+'\n\n'+ctx:text});if(c.msgs.length===1)c.title=text.slice(0,40);c.ts=Date.now();
 const a={role:'assistant',content:''};c.msgs.push(a);busy=true;ctl=new AbortController();showPanel();renderBody();
 const hist=c.msgs.slice(0,-1).filter(m=>m.content&&!m.err).slice(-20).map(m=>({role:m.role,content:m.content}));
 try{await groq([{role:'system',content:SYS},...hist],t=>{a.content+=t;sched()},ctl.signal)}
 catch(e){if(e.name!=='AbortError')a.err=e.message}
 busy=false;ctl=null;if(!a.content&&!a.err)a.content='(stopped)';
 chats.sort((x,y)=>y.ts-x.ts);saveChats();renderBody()}

function askAI(code){const f=cur?cur.name:'file';dlg({title:'Ask AI',fields:[{k:'q',label:'Question',val:'Explain this code'}],ok:'Ask'}).then(r=>{if(!r||!r.q.trim())return;
 newChat();send(r.q,'File: '+f+'\n```\n'+code.slice(0,8000)+'\n```')})}

$$('aiS').onclick=()=>{if(busy&&ctl)return ctl.abort();const t=aiI.value;aiI.value='';aiI.style.height='';send(t)};
aiI.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();$$('aiS').click()}};
aiI.oninput=()=>{aiI.style.height='auto';aiI.style.height=Math.min(120,aiI.scrollHeight)+'px'};
$$('aiX').onclick=hidePanel;
$$('aiN').onclick=()=>{if(busy)return toast('Wait for the reply to finish');newChat();renderBody();showPanel();aiI.focus()};
$$('aiL').onclick=()=>{view=view==='list'?'chat':'list';renderBody()};
aiB.onclick=ev=>{const cp=ev.target.closest('.cp');if(cp){return copyTxt(cp.nextElementSibling.textContent)}
 const d=ev.target.closest('[data-del]');if(d){ev.stopPropagation();chats=chats.filter(x=>x.id!==d.dataset.del);if(active===d.dataset.del)active=null;saveChats();return renderBody()}
 const r=ev.target.closest('.cl');if(r&&!busy){active=r.dataset.id;view='chat';saveChats();renderBody()}};
const openChats=()=>{view='list';renderBody();showPanel()};

/* ---------------- wiring: sidebar, home screen, palette ---------------- */
{const nav=document.querySelector('.nav'),mk=(id,label,svg,fn)=>{const b=document.createElement('button');b.className='item';b.id=id;b.innerHTML=`<svg viewBox="0 0 16 16">${svg}</svg>${label}`;b.onclick=fn;nav.appendChild(b)};
 mk('bSec','Secrets','<rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.500 7V5a2.500 2.500 0 0 1 5 0v2"/>',openSecrets);
 mk('bChats','Chats','<path d="M2.500 3.500h11v7h-5l-3 2.500v-2.500h-3z"/>',openChats)}
{const p=document.querySelector('#drop p');if(p){const t=document.createElement('textarea');t.id='mq';t.rows=2;t.placeholder='Ask AI anything, or open a folder…';p.replaceWith(t);
 const go=()=>{const v=t.value.trim();if(!v)return $$('fd').click();t.value='';newChat();send(v)};
 $$('bGo').onclick=go;$$('bGo').title='Send / open folder';t.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();go()}}}}
T('Tijori','Open secrets…',openSecrets,'A');
T('Tijori','Insert secret at cursor…',()=>{const ta=$$('ta');pickSecret(ta.selectionStart,ta.selectionEnd)},'A');
T('AI','Open chats',openChats,'A');T('AI','New chat',()=>$$('aiN').click(),'A');
renderBody();if(chats.length&&getChat()===undefined)active=null;
})();
</script>

<script>
(()=>{
  const mq=matchMedia('(max-width:900px)');
  const side=document.getElementById('side');
  const scrim=document.createElement('div');
  scrim.id='scrim';
  document.getElementById('app').appendChild(scrim);

  const syncScrim=()=>scrim.classList.toggle('on',mq.matches&&!side.classList.contains('hide'));
  const setHidden=h=>{side.classList.toggle('hide',h);syncScrim()};

  // start with the drawer closed on small screens, open on large ones
  setHidden(mq.matches);
  mq.addEventListener('change',e=>setHidden(e.matches));
  new MutationObserver(syncScrim).observe(side,{attributes:true,attributeFilter:['class']});
  scrim.onclick=()=>setHidden(true);

  // close the drawer after picking a file or a sidebar action
  document.getElementById('tree').addEventListener('click',e=>{
    const row=e.target.closest('.row');
    if(mq.matches&&row&&!row.querySelector('.ch')&&!e.target.closest('.mx'))setHidden(true);
  });
  document.querySelector('.nav').addEventListener('click',e=>{
    const b=e.target.closest('button.item');
    if(mq.matches&&b&&b.id!=='bTheme'&&b.id!=='bSearch')setHidden(true);
  });

  // Esc closes the drawer
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mq.matches)setHidden(true)});
})();
</script>

<script>
(()=>{
const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const WS='vk_ws_v1',GK='vk_gh';

/* ============ 1. Persistence (localStorage) ============ */
const isTxt=p=>{const e=ext(baseOf(p));return !(IMG.includes(e)&&e!=='svg')&&!BIN.includes(e)&&!AUD.includes(e)&&!VID.includes(e)};
const durl=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
let ready=false,st=0,warned=false;
async function save(){if(!ready)return;
 try{const files={};let size=0;
  for(const[p,f]of pmap){const tb=tbOf(p);let o;
   if(tb&&tb.kind==='txt')o={c:tb.text};else if(isTxt(p))o={c:await f.text()};else o={c:await durl(f),b:1,m:f.type};
   size+=o.c.length;if(size>4.6e6){if(!warned){warned=true;toast('Workspace too big to fully save in browser storage')}break}
   files[p]=o}
  localStorage.setItem(WS,JSON.stringify({files,dirs:[...dirs],open:[...openSet],tabs:tabs.map(t=>t.path),cur:cur&&cur.path,name:$('repo').textContent}))}
 catch(e){if(!warned){warned=true;toast('Could not save workspace (storage full?)')}}}
const sched=()=>{clearTimeout(st);st=setTimeout(save,500)};
async function restore(){let d=null;try{d=JSON.parse(LS(WS)||'null')}catch(e){}
 if(d&&d.files&&(Object.keys(d.files).length||(d.dirs||[]).length)){
  ensureRoot();pmap=new Map();dirs=new Set(d.dirs||[]);openSet=new Set(d.open||[]);
  for(const[p,o]of Object.entries(d.files)){let f;
   if(o.b){const s=atob(o.c.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);f=new File([u],baseOf(p),{type:o.m||''})}
   else f=new File([o.c],baseOf(p));
   pmap.set(p,f);addDirs(parentOf(p))}
  root=build();$('repo').textContent=$('mname').textContent=d.name||'Workspace';$('q').style.display='block';
  for(const p of d.tabs||[])if(pmap.has(p))await openFile({path:p});
  if(d.cur&&tbOf(d.cur)){cur=tbOf(d.cur);sel=d.cur}
  showView();toast('Workspace restored')}
 ready=true}
{const _r=render;render=function(){_r();sched()}}
$('ta').addEventListener('input',sched);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
addEventListener('pagehide',save);

/* ============ 2. Bug fixes ============ */
/* Ctrl+S / Download button failed outside claude.ai -> use the fallback saver */
download=async function(){if(!cur)return toast('Open a file first');
 const data=cur.kind==='txt'?new TextEncoder().encode(cur.text):new Uint8Array(await cur.file.arrayBuffer());
 if(await saveBytes(cur.name,data)){cur.orig=cur.text;showView();toast('Saved '+cur.name)}};
$('bDl').onclick=$('bDl2').onclick=()=>download();
/* Folder picker (webkitdirectory) is unsupported on most phones -> fall back to multi-file picker */
if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform)))$('fd').click=()=>$('ff').click();

/* ============ 3. GitHub ============ */
let G=null;try{G=JSON.parse(LS(GK)||'null')}catch(e){}
const gsave=()=>LS(GK,G?JSON.stringify(G):null);
async function api(path,o={}){if(!G||!G.token)throw Error('Not connected to GitHub');
 const r=await fetch(path.startsWith('http')?path:'https://api.github.com'+path,{method:o.m||'GET',headers:{Authorization:'Bearer '+G.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(o.b?{'Content-Type':'application/json'}:{})},body:o.b?JSON.stringify(o.b):undefined});
 if(r.status===204)return null;const j=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401){G.token='';gsave()}const e=Error(j.message||'HTTP '+r.status);e.status=r.status;throw e}return j}
const u2b=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b2u=b=>{const s=atob(b.replace(/\s/g,'')),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const gsha=async u=>{const h=new TextEncoder().encode('blob '+u.length+'\0'),a=new Uint8Array(h.length+u.length);a.set(h);a.set(u,h.length);return[...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(b=>b.toString(16).padStart(2,'0')).join('')};
const pool=async(a,n,fn)=>{let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<a.length)await fn(a[i++])}))};
const encP=p=>p.split('/').map(encodeURIComponent).join('/');

/* --- connect (popup) --- */
function connect(){
 const o=document.createElement('div');o.className='mdl';
 o.innerHTML='<div class="mc" style="width:min(460px,94vw)"><div class="mh"><b>Connect GitHub</b><button class="x">×</button></div><div class="mb"><div class="gh-s">1. GitHub opens in a popup with the right permissions pre-selected. Click “Generate token”, then copy it.</div><button class="pri" id="gA" style="align-self:stretch">Open GitHub</button><div class="gh-s">2. Come back — it connects automatically when you paste (or just return to this tab).</div><input id="gT" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false"><div class="er" id="gE"></div><div class="gh-s" id="gS">The token is stored only in this browser.</div></div></div>';
 document.body.appendChild(o);
 const T=o.querySelector('#gT'),E=o.querySelector('#gE'),S=o.querySelector('#gS');let pop=null,busy_=false;
 const close=()=>{removeEventListener('focus',onf);o.remove()};
 o.querySelector('.x').onclick=close;o.onmousedown=e=>{if(e.target===o)close()};
 const tryTok=async v=>{v=(v||'').trim();if(busy_||!/^(gh[pousr]_|github_pat_)\w+$/.test(v))return;busy_=true;E.textContent='';S.textContent='Verifying…';
  try{const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+v}});if(!r.ok)throw Error('GitHub rejected this token');const u=await r.json();
   G={...(G||{}),token:v,user:{login:u.login,avatar_url:u.avatar_url},repo:(G&&G.repo)||'',branch:(G&&G.branch)||'',base:(G&&G.base)||{}};gsave();
   try{pop&&pop.close()}catch(e){}close();toast('Connected as '+u.login);ghOpen('repos')}
  catch(e){E.textContent=e.message;S.textContent='Try again with a fresh token.'}busy_=false};
 const onf=async()=>{try{const t=await navigator.clipboard.readText();if(t&&t!==T.value){T.value=t.trim();tryTok(t)}}catch(e){}};
 addEventListener('focus',onf);
 T.oninput=()=>tryTok(T.value);
 o.querySelector('#gA').onclick=()=>{const url='https://github.com/settings/tokens/new?description='+encodeURIComponent('Vasuki Editor')+'&scopes=repo,delete_repo,workflow';
  const w=700,h=780;pop=window.open(url,'gh_auth',`popup=yes,width=${w},height=${h},left=${Math.max(0,(screen.width-w)/2)},top=${Math.max(0,(screen.height-h)/2)}`);
  if(!pop)pop=window.open(url,'_blank');if(!pop)E.textContent='Popup blocked — allow popups for this site and try again.'};
 T.focus()}

/* --- modal shell --- */
let M=null,tab='repos';
const TABS={repos:'Repos',commit:'Commit',branches:'Branches',prs:'Pull requests',issues:'Issues',acct:'Account'};
function ghOpen(t){if(!G||!G.token)return connect();if(M)M.remove();
 M=document.createElement('div');M.className='mdl';
 M.innerHTML='<div class="mc gh"><div class="mh"><div class="gh-u" id="ghu"></div><button class="x">×</button></div><div class="gh-t" id="ght"></div><div class="mb" id="ghb"></div></div>';
 document.body.appendChild(M);const close=()=>{M&&M.remove();M=null};
 M.querySelector('.x').onclick=close;M.onmousedown=e=>{if(e.target===M)close()};
 $('ght').onclick=e=>{const b=e.target.closest('[data-t]');b&&show(b.dataset.t)};show(t||tab)}
function head(){const u=$('ghu');if(!u||!G)return;u.innerHTML=`<img src="${esc(G.user.avatar_url)}" alt=""><div style="min-width:0"><b>${esc(G.user.login)}</b><div class="gh-s">${G.repo?esc(G.repo)+' · '+esc(G.branch):'No repo linked'}</div></div>`;
 $('ght').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('')}
async function show(t){tab=t;head();const b=$('ghb');if(!b)return;b.onclick=null;b.innerHTML='<div class="em">Loading…</div>';
 try{await V[t](b)}catch(e){if($('ghb')===b)b.innerHTML='<div class="er">'+esc(e.message)+(e.status===401?' — please reconnect from the Account tab.':'')+'</div>'}head()}
const on=(b,fn)=>{b.onclick=async ev=>{const x=ev.target.closest('[data-a]');if(!x)return;const t=x.textContent;x.disabled=true;
 try{await fn(x.dataset.a,x.dataset)}catch(e){toast(e.message)}if(x.isConnected){x.disabled=false;x.textContent=t}}};
const need=b=>{b.innerHTML='<div class="em">Link or create a repo first (Repos tab).</div>'};

/* --- git operations --- */
async function clone(full,br){const prog=m=>{const b=$('ghb');b&&(b.innerHTML='<div class="em">'+esc(m)+'</div>')};
 prog('Reading tree…');let t;
 try{t=await api(`/repos/${full}/git/trees/${encodeURIComponent(br)}?recursive=1`)}
 catch(e){if(e.status===409||e.status===404){G.repo=full;G.branch=br;G.base={};gsave();toast('Repo is empty — linked');return}throw e}
 const bl=t.tree.filter(x=>x.type==='blob');if(t.truncated||bl.length>400)toast('Large repo: loading the first 400 files');
 const list=bl.slice(0,400),np=new Map(),base={};let n=0;
 await pool(list,6,async x=>{const j=await api(`/repos/${full}/git/blobs/${x.sha}`);np.set(x.path,new File([b2u(j.content)],baseOf(x.path)));base[x.path]=x.sha;prog('Downloading '+(++n)+'/'+list.length)});
 pmap=np;dirs=new Set();openSet=new Set();np.forEach((_,p)=>addDirs(parentOf(p)));root=build();tabs=[];cur=null;sel=null;
 $('repo').textContent=$('mname').textContent=full.split('/')[1];$('q').style.display='block';
 G.repo=full;G.branch=br;G.base=base;gsave();render();showView();toast('Cloned '+full)}
async function changes(){const now={},out=[];for(const p of pmap.keys())now[p]=await gsha(await bytesOf(p));
 for(const p in now)if(G.base[p]!==now[p])out.push({p,s:G.base[p]?'M':'A',sha:now[p]});
 for(const p in G.base)if(!(p in now))out.push({p,s:'D'});return out.sort((a,b)=>a.p.localeCompare(b.p))}
async function push(items,msg){const R='/repos/'+G.repo,br=encodeURIComponent(G.branch);let parent=null,baseTree=null;
 const head_=async()=>{const ref=await api(`${R}/git/ref/heads/${br}`);parent=ref.object.sha;baseTree=(await api(`${R}/git/commits/${parent}`)).tree.sha};
 try{await head_()}catch(e){if(e.status!==404&&e.status!==409)throw e}
 if(!parent){const f=items.find(x=>x.s!=='D');if(!f)throw Error('Nothing to push');
  await api(`${R}/contents/${encP(f.p)}`,{m:'PUT',b:{message:msg,content:u2b(await bytesOf(f.p)),branch:G.branch}});
  G.base[f.p]=f.sha;gsave();items=items.filter(x=>x!==f);if(!items.length)return;await head_()}
 const tree=[];
 await pool(items,4,async x=>{if(x.s==='D')tree.push({path:x.p,mode:'100644',type:'blob',sha:null});
  else{const j=await api(R+'/git/blobs',{m:'POST',b:{content:u2b(await bytesOf(x.p)),encoding:'base64'}});tree.push({path:x.p,mode:'100644',type:'blob',sha:j.sha})}});
 const t=await api(R+'/git/trees',{m:'POST',b:{base_tree:baseTree,tree}});
 const c=await api(R+'/git/commits',{m:'POST',b:{message:msg,tree:t.sha,parents:[parent]}});
 await api(`${R}/git/refs/heads/${br}`,{m:'PATCH',b:{sha:c.sha}});
 items.forEach(x=>{if(x.s==='D')delete G.base[x.p];else G.base[x.p]=x.sha});gsave()}

/* --- tab views --- */
const V={};
V.repos=async b=>{
 b.innerHTML='<div class="sr"><b>New repository</b><input id="nrN" placeholder="repo-name" style="margin-top:6px"><input id="nrD" placeholder="Description (optional)" style="margin-top:6px"><label class="gh-s" style="margin-top:6px"><input type="checkbox" id="nrP" checked style="width:auto;margin:0"> Private</label><label class="gh-s"><input type="checkbox" id="nrW" checked style="width:auto;margin:0"> Push current workspace after creating</label><div class="ac" style="margin-top:6px"><button class="pri" data-a="mk">Create repository</button></div></div><div id="rl"><div class="em">Loading repos…</div></div>';

  if(a==='mk'){const n=$('nrN').value.trim();if(!n)throw Error('Repository name required');const go=$('nrW').checked&&pmap.size;
   const r=await api('/user/repos',{m:'POST',b:{name:n,description:$('nrD').value,private:$('nrP').checked,auto_init:false}});

   await api('/repos/'+d.f,{m:'DELETE'});if(G.repo===d.f){G.repo='';G.base={};gsave()}toast('Deleted');show('repos')}});
 const l=await api('/user/repos?per_page=100&sort=pushed'),rl=$('rl');if(!rl)return;
 rl.innerHTML=l.map(r=>`<div class="sr gh-r" style="margin-top:8px"><span><b>${esc(r.name)}</b>${r.private?' 🔒':''}${r.full_name===G.repo?' · linked':''}<div class="gh-s">${esc(r.description||r.full_name)}</div></span><span class="ac"><button data-a="clone" data-f="${esc(r.full_name)}" data-b="${esc(r.default_branch)}">Clone</button><button data-a="link" data-f="${esc(r.full_name)}" data-b="${esc(r.default_branch)}">Link</button><button data-a="del" data-f="${esc(r.full_name)}">Delete</button></span></div>`).join('')||'<div class="em">No repositories yet.</div>'};
V.commit=async b=>{if(!G.repo)return need(b);const ch=await changes();
 b.innerHTML=`<div class="gh-s">Pushing to <b>${esc(G.repo)}</b> on <b>${esc(G.branch)}</b></div>`+(ch.length?ch.map((x,i)=>`<label class="sr gh-r"><span><b>${x.s}</b> ${esc(x.p)}</span><input type="checkbox" data-i="${i}" checked style="width:auto"></label>`).join('')+'<input id="cmM" value="Update from 0x Loom Editor" placeholder="Commit message"><button class="pri" data-a="push">Commit &amp; push</button>':'<div class="em">Everything is in sync.</div>')+'<button class="sr" data-a="pull">Pull latest (replaces workspace)</button>';
 on(b,async a=>{
  if(a==='push'){const items=[...b.querySelectorAll('input[data-i]:checked')].map(i=>ch[+i.dataset.i]);if(!items.length)throw Error('Select at least one file');
   const msg=$('cmM').value.trim()||'Update';b.querySelector('[data-a=push]').textContent='Pushing…';await push(items,msg);toast('Pushed '+items.length+' change'+(items.length>1?'s':''));show('commit')}
  else if(await dlg({title:'Replace workspace?',msg:'Local changes will be overwritten with '+G.repo+'@'+G.branch+'.',ok:'Pull',danger:1})){await clone(G.repo,G.branch);show('commit')}})};
V.branches=async b=>{if(!G.repo)return need(b);const l=await api(`/repos/${G.repo}/branches?per_page=100`);
 b.innerHTML=`<div class="sr"><input id="nb" placeholder="new-branch (from ${esc(G.branch)})"><div class="ac" style="margin-top:6px"><button class="pri" data-a="nb">Create branch</button></div></div>`+l.map(x=>`<div class="sr gh-r"><span><b>${esc(x.name)}</b>${x.name===G.branch?' · current':''}</span><span class="ac">${x.name===G.branch?'':`<button data-a="sw" data-b="${esc(x.name)}">Switch &amp; pull</button>`}</span></div>`).join('');
 on(b,async(a,d)=>{
  if(a==='nb'){const n=$('nb').value.trim();if(!n)throw Error('Branch name required');const ref=await api(`/repos/${G.repo}/git/ref/heads/${encodeURIComponent(G.branch)}`);
   await api(`/repos/${G.repo}/git/refs`,{m:'POST',b:{ref:'refs/heads/'+n,sha:ref.object.sha}});G.branch=n;gsave();toast('Created & switched to '+n);show('branches')}
  else if(await dlg({title:'Switch to '+d.b+'?',msg:'The workspace will be replaced with that branch.',ok:'Switch',danger:1})){await clone(G.repo,d.b);show('branches')}})};
V.prs=async b=>{if(!G.repo)return need(b);const R='/repos/'+G.repo,[info,l]=await Promise.all([api(R),api(R+'/pulls?state=open&per_page=50')]);
 b.innerHTML=`<div class="sr"><input id="pT" placeholder="Pull request title"><input id="pH" value="${esc(G.branch)}" placeholder="head branch" style="margin-top:6px"><input id="pB" value="${esc(info.default_branch)}" placeholder="base branch" style="margin-top:6px"><div class="ac" style="margin-top:6px"><button class="pri" data-a="mk">Open pull request</button></div></div>`+(l.map(x=>`<div class="sr gh-r"><span><a href="${esc(x.html_url)}" target="_blank" rel="noopener">#${x.number} ${esc(x.title)}</a><div class="gh-s">${esc(x.head.ref)} → ${esc(x.base.ref)}</div></span><span class="ac"><button data-a="mg" data-n="${x.number}">Merge</button></span></div>`).join('')||'<div class="em">No open pull requests.</div>');
 on(b,async(a,d)=>{
  if(a==='mk'){const t=$('pT').value.trim();if(!t)throw Error('Title required');await api(R+'/pulls',{m:'POST',b:{title:t,head:$('pH').value.trim(),base:$('pB').value.trim()}});toast('Pull request opened');show('prs')}
  else if(await dlg({title:'Merge #'+d.n+'?',ok:'Merge'})){await api(`${R}/pulls/${d.n}/merge`,{m:'PUT',b:{}});toast('Merged');show('prs')}})};

const KW=new Set('if else for while return function const let var class new this typeof import export from default async await try catch finally throw switch case break continue in of true false null undefined def self None True False and or not is lambda pass yield with as del global elif except raise print do void static public private protected int string bool float double'.split(' '));

async function scan(){const F=[],LN=[],ix=new Map(),decl=[];let total=0;
 for(const p of pmap.keys()){if(!isCode(p))continue;const t=await txt(p);total+=t.length;if(t.length>3e5||total>3e6)continue;
  const fi=F.push(p)-1,py=/\.py$/i.test(p),lines=t.split('\n');LN.push(lines);let bc=false;
  lines.forEach((raw,li)=>{if(raw.length>2000)return;let l=raw;
   if(!py){if(bc){const e=l.indexOf('*/');if(e<0)return;l=' '.repeat(e+2)+l.slice(e+2);bc=false}
    l=l.replace(/\/\*.*?\*\//g,m=>' '.repeat(m.length));const s=l.indexOf('/*');if(s>=0){bc=true;l=l.slice(0,s)}}
   l=l.replace(/(["'`])(?:\\.|(?!\1).)*\1/g,m=>' '.repeat(m.length)).replace(py?/#.*$/:/\/\/.*$/,'');
   for(const m of l.matchAll(/[A-Za-z_$][\w$]*/g)){const w=m[0];if(KW.has(w))continue;let a=ix.get(w);if(!a)ix.set(w,a=[]);a.push([fi,li+1,m.index])}
   const add=(n,kind,c)=>{if(n&&!KW.has(n)&&/^[A-Za-z_$][\w$]*$/.test(n))decl.push({n,kind,fi,l:li+1,c})};
   const D=(re,kind)=>{for(const m of l.matchAll(re))add(m[1],kind,m.index+m[0].lastIndexOf(m[1]))};
   const PR=(m,from)=>{(m[1]||m[2]||'').split(',').forEach(s=>{const n=s.trim().replace(/^\.\.\./,'').replace(/[=:].*$/,'').trim();if(n)add(n,'param',m.index+m[0].indexOf(n,from))})};
   if(py){D(/\bdef\s+([A-Za-z_]\w*)/g,'function');D(/\bclass\s+([A-Za-z_]\w*)/g,'class');D(/^\s*([A-Za-z_]\w*)\s*(?::[^=]+)?=(?!=)/g,'variable');D(/\bimport\s+([A-Za-z_]\w*)/g,'import');D(/\bfor\s+([A-Za-z_]\w*)\s+in\b/g,'variable');
    for(const m of l.matchAll(/\bdef\s+\w+\s*\(([^)]*)\)/g))PR(m,m[0].indexOf('('))}
   else{D(/\bfunction\s*\*?\s*([A-Za-z_$][\w$]*)/g,'function');D(/\b(?:class|struct|interface|enum)\s+([A-Za-z_$][\w$]*)/g,'class');D(/\b(?:func|fn|fun)\s+([A-Za-z_]\w*)/g,'function');
    for(const m of l.matchAll(/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(async\s+)?(function\b|\([^)]*\)\s*=>|[\w$]+\s*=>)?/g))add(m[1],m[3]?'function':'variable',m.index+m[0].indexOf(m[1],m[0].search(/\s/)));
    for(const m of l.matchAll(/\b(?:const|let|var)\s*[{[]([^}\]=]*)[}\]]\s*=/g))m[1].split(',').forEach(s=>{const n=s.split(':').pop().replace(/=.*$/,'').trim();if(n)add(n,'variable',m.index+m[0].indexOf(n))});
    for(const m of l.matchAll(/\bfunction\s*[\w$]*\s*\(([^)]*)\)|\(([^()]*)\)\s*=>/g))PR(m,m[0].indexOf('('));
    for(const m of l.matchAll(/\bimport\s+([A-Za-z_$][\w$]*)/g))add(m[1],'import',m.index+m[0].lastIndexOf(m[1]))}})}
 const dp=new Set(decl.map(d=>d.fi+':'+d.l+':'+d.c)),by=new Map();
 for(const d of decl){let s=by.get(d.n);if(!s)by.set(d.n,s={n:d.n,decls:[],uses:[]});s.decls.push(d)}
 for(const s of by.values())s.uses=(ix.get(s.n)||[]).filter(u=>!dp.has(u[0]+':'+u[1]+':'+u[2]));
 const ed=new Map();for(const s of by.values()){const df=new Set(s.decls.map(d=>d.fi));if(df.size!==1)continue;const a=[...df][0];for(const u of s.uses)if(u[0]!==a){const k=u[0]+'>'+a;ed.set(k,(ed.get(k)||0)+1)}}
