<style>

*{box-sizing:border-box}

.code{position:absolute;left:56px;right:0;top:0;bottom:0;margin:0;padding:12px 16px 40px 8px;font:12.5px/20px ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre;tab-size:2;overflow:auto;border:0;outline:none;letter-spacing:0;word-spacing:0}

#prev .ph button{padding:5px;border-radius:7px;font-size:17px;line-height:1}#prev .ph button:hover{background:var(--hover);color:var(--tx)}

@media(max-width:700px){#prev{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:none;z-index:6}}
/* Apple-style loader */
.spin{position:relative;width:var(--s,20px);height:var(--s,20px);flex:none}

@keyframes fd{0%{opacity:1}100%{opacity:.08}}

@media(max-width:700px){#side{position:absolute;z-index:5;height:100%;box-shadow:4px 0 20px rgba(0,0,0,.1)}}
#med{position:absolute;inset:41px 0 28px 0;display:none;place-items:center;padding:20px;overflow:auto}#med video{max-width:100%;max-height:100%;border-radius:8px}#med audio{width:min(480px,100%)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:20}.ov.top{place-items:start center;padding-top:12vh}
.dlg,.pal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.2);width:min(420px,92vw);padding:18px}
.dlg h3{margin:0 0 10px;font-weight:600;font-size:15px}.dlg p{margin:0 0 12px;color:var(--mut)}

.dlg input,.pal input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;outline:none}
.dlg input:focus,.pal input:focus{border-color:var(--acc)}
.bt{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.bt button{padding:7px 14px;border-radius:8px;background:var(--hover)}.bt .ok{background:var(--acc);color:var(--bg);font-weight:500}.bt .ok.danger{background:var(--err);color:#fff}
.pal{width:min(560px,94vw);padding:10px}.pal input{margin:0 0 8px}.pl{max-height:50vh;overflow:auto}
.pi{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:8px;cursor:pointer}.pi.on{background:var(--sel)}.pi em{font-style:normal;color:var(--mut);font-size:12px}.pi.mut{color:var(--mut)}
#cm{position:fixed;z-index:30;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#cm button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:6px}#cm button:hover{background:var(--hover)}#cm .danger{color:var(--err)}#cm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.row .mx{margin-left:auto;opacity:0;padding:0 5px;border-radius:5px;color:var(--mut);line-height:1.2}.dot+.mx{margin-left:6px}.row:hover .mx,.row.on .mx{opacity:1}.mx:hover{background:var(--line)}
.row.dt{background:var(--sel);outline:1px dashed var(--mut)}#tree.dt{outline:1px dashed var(--mut);outline-offset:-4px}
#top #bPal{font-size:12.5px;padding:5px 10px;white-space:nowrap}
</style></head>

<script>
    if (!window.localStorage.getItem("vcloud_user")) {
        window.location.href = "onboard.html";
    }
document.querySelector(".user_name").textContent = localStorage.getItem("vcloud_username") || "User";
const $=id=>document.getElementById(id);
document.querySelectorAll('.spin').forEach(s=>{for(let i=0;i<12;i++){const b=document.createElement('b');b.style.transform=`rotate(${i*30}deg)`;b.style.animationDelay=`${-1+i/12}s`;s.appendChild(b)}});
const ic={dir:'<svg viewBox="0 0 16 16"><path d="M2 4.500A1.500 1.500 0 0 1 3.500 3h3L8 4.500h4.500A1.500 1.500 0 0 1 14 6v5.500a1.500 1.500 0 0 1-1.500 1.500h-9A1.500 1.500 0 0 1 2 11.500z"/></svg>',file:'<svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>',ch:'<svg class="ch" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>'};
const LANG={js:'javascript',mjs:'javascript',cjs:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',py:'python',html:'xml',htm:'xml',xml:'xml',svg:'xml',vue:'xml',css:'css',scss:'scss',less:'less',json:'json',md:'markdown',yml:'yaml',yaml:'yaml',sh:'bash',bash:'bash',zsh:'bash',java:'java',c:'c',h:'c',cpp:'cpp',hpp:'cpp',cs:'csharp',go:'go',rs:'rust',rb:'ruby',php:'php',sql:'sql',swift:'swift',kt:'kotlin',lua:'lua',r:'r',toml:'ini',ini:'ini',dockerfile:'dockerfile',diff:'diff',txt:'plaintext'};
const IMG=['png','jpg','jpeg','gif','webp','svg','ico','bmp','avif'];
const BIN=['zip','gz','tar','exe','dll','so','pdf','mp4','mov','mp3','wav','woff','woff2','ttf','otf','bin','class','jar','pyc','db','sqlite'];
const ext=n=>{const e=n.split('.').pop().toLowerCase();return n.includes('.')?e:n.toLowerCase()};
let pmap=new Map(),root=null,files=[],tabs=[],cur=null,filter='';
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)};
const busy=async(m,fn)=>{$('busyt').textContent=m;$('busy').classList.add('on');await new Promise(r=>setTimeout(r,30));try{return await fn()}finally{$('busy').classList.remove('on')}};
setTimeout(()=>{$('splash').style.opacity=0;setTimeout(()=>$('splash').remove(),500)},650);

/* ---------- tree ---------- */
function build(list){const r={name:'',dirs:{},files:[],open:true};
 for(const f of list){const p=(f.webkitRelativePath||f.name).split('/');if(f.webkitRelativePath)p.shift();let n=r;
  for(let i=0;i<p.length-1;i++){n=n.dirs[p[i]]??=(({name:p[i],dirs:{},files:[],open:false}))}
  n.files.push({name:p[p.length-1],file:f,path:(f.webkitRelativePath||f.name)})}
 return r}
function match(n){if(!filter)return true;return n.files.some(f=>f.name.toLowerCase().includes(filter))||Object.values(n.dirs).some(match)}
function render(){const t=$('tree');t.innerHTML='';if(!root)return;
 const walk=(n,box,d)=>{
  Object.values(n.dirs).sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{if(!match(c))return;
   const r=document.createElement('div');r.className='row'+(c.open||filter?' open':'');r.style.paddingLeft=8+d*14+'px';r.innerHTML=ic.ch+ic.dir+`<span>${esc(c.name)}</span>`;
   r.onclick=()=>{c.open=!c.open;render()};box.appendChild(r);if(c.open||filter)walk(c,box,d+1)});
  n.files.filter(f=>!filter||f.name.toLowerCase().includes(filter)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
   const r=document.createElement('div');r.className='row'+(cur&&cur.path===f.path?' on':'');r.style.paddingLeft=8+d*14+'px';
   const tb=tabs.find(x=>x.path===f.path);
   r.innerHTML=`<svg style="width:12px;visibility:hidden"></svg>`+ic.file+`<span>${esc(f.name)}</span>`+(tb&&tb.text!==tb.orig?'<i class="dot"></i>':'');
   r.onclick=()=>openFile(f);box.appendChild(r)})};
 walk(root,t,0)}

  const nd=[...dirs].filter(d=>d===src||d.startsWith(src+'/')).map(d=>[d,dst+d.slice(src.length)]);nd.forEach(([a])=>dirs.delete(a));nd.forEach(([,b])=>dirs.add(b));nd.forEach(([a,b])=>{if(openSet.delete(a))openSet.add(b)})}

async function rename(p){const r=await dlg({title:'Rename',fields:[{k:'n',label:'New name',val:baseOf(p)}],ok:'Rename'});if(!r)return;const n=r.n.trim();if(!n||/[\/\\]/.test(n))return toast('Invalid name');

  for(const[k,f]of[...pmap]){if(!k.startsWith(p+'/'))continue;const nk=np+k.slice(p.length),tb=tbOf(k);pmap.set(nk,new File([tb&&tb.kind==='txt'?tb.text:f],baseOf(nk),{type:f.type}));addDirs(parentOf(nk))}}

async function saveBytes(name,data,mime){let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}

const rep=(s,e,out)=>{const ta=$('ta');ta.focus();ta.setSelectionRange(s,e);const ok=out===''?document.execCommand('delete'):document.execCommand('insertText',false,out);

async function applyTool(tool){if(tool.o==='A')return tool.f(null,{});
 if(!cur||cur.kind!=='txt')return toast('Open a text file first');const ta=$('ta'),v=ta.value;let s=ta.selectionStart,e=ta.selectionEnd;

const goLine=async()=>{if(!cur||cur.kind!=='txt')return;const r=await dlg({title:'Go to line',fields:[{k:'n',label:'Line number'}],ok:'Go'});if(!r)return;const ta=$('ta'),ls=ta.value.split('\n'),n=Math.max(1,Math.min(ls.length,parseInt(r.n)||1));

const findRep=async()=>{if(!cur||cur.kind!=='txt')return toast('Open a text file first');const r=await dlg({title:'Find & replace',fields:[{k:'a',label:'Find (text, or /regex/flags)'},{k:'b',label:'Replace with'}],ok:'Replace all'});if(!r||!r.a)return;

.am pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;margin:6px 0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
.am code{font:12px ui-monospace,Menlo,Consolas,monospace}.am p{margin:0}.am .cp{float:right;font-size:11px;color:var(--mut);padding:0 4px}
.am.user pre{color:var(--tx)}.am .er{margin-top:4px}
.aiin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}.aiin textarea{resize:none;max-height:120px}
#aiS{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--bg);flex:none;font-size:16px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.cl:hover{background:var(--hover)}.cl em{font-style:normal;color:var(--mut);font-size:12px}.cl button{color:var(--mut)}

<script>
(()=>{
/* ---------------- config ---------------- */
const SB_URL="https://aitckloahlwemlekaour.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpdGNrbG9haGx3ZW1sZWthb3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyOTQ3MTMsImV4cCI6MjA3MTg3MDcxM30.uQjQLSz0mQuuArPQ_F8u-suQ-6T0e9bF11ahQtSw6yA";
const TABLE="env"; /* same table + row layout as Tijori: id = vcloud_user, data = JSON array of {label,data,ts,id} */
const GROQ_URL="https://api.groq.com/openai/v1/chat/completions",MODEL="openai/gpt-oss-120b";
const GROQ_KEYS=[
 "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",
 "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", /* key 2 */
 "", /* key 3 */
 "", /* key 4 */
 "", /* key 5 */
];
const SYS="You are a concise, accurate coding assistant inside a browser code editor. Use markdown code fences for code.";
const $$=id=>document.getElementById(id);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------------- Tijori vault ---------------- */
let sb=null;
const loadLib=()=>new Promise((ok,no)=>{if(window.supabase)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=()=>no(Error('Could not load Supabase (network blocked?)'));document.head.appendChild(s)});
async function client(){if(!sb){await loadLib();sb=supabase.createClient(SB_URL,SB_KEY)}return sb}
async function vaultId(){let id=lsGet('vcloud_user');if(id)return id;
 const r=await dlg({title:'Vault ID',msg:'Paste your Tijori Vault ID (shown in your vault as the lock chip).',fields:[{k:'id',label:'Vault ID'}],ok:'Use'});
 if(!r||!r.id.trim())throw Error('Vault ID required');lsSet('vcloud_user',r.id.trim());return r.id.trim()}
async function fetchAll(){const id=await vaultId(),c=await client();
 const{data,error}=await c.from(TABLE).select('data').eq('id',id).maybeSingle();if(error)throw error;
 if(!data||!data.data)return[];let p;try{p=JSON.parse(data.data)}catch(e){throw Error('Vault data unreadable; refusing to overwrite')}
 return Array.isArray(p)?p:[]}
async function mutate(fn){const list=await fetchAll(),out=fn(list),c=await client();
 const{error}=await c.from(TABLE).upsert({id:await vaultId(),data:JSON.stringify(out)},{onConflict:'id'});if(error)throw error;return out}
const kid=(e,i)=>e.id||'i'+i;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&3|8).toString(16)});
const copyTxt=async t=>{try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Copy blocked by browser')}};

function modal(title){const o=document.createElement('div');o.className='mdl';
 o.innerHTML=`<div class="mc"><div class="mh"><b>${esc(title)}</b><button class="x" title="Close">×</button></div><div class="mb"></div></div>`;document.body.appendChild(o);
 const k=e=>{if(e.key==='Escape'){e.stopPropagation();close()}},close=()=>{o.remove();document.removeEventListener('keydown',k,true)};
 document.addEventListener('keydown',k,true);o.onmousedown=e=>{if(e.target===o)close()};o.querySelector('.x').onclick=close;return{body:o.querySelector('.mb'),close}}

async function openSecrets(){
 const m=modal('Tijori · Secrets');let list=[],edit=null,shown=new Set(),err='',loading=true;
 m.body.innerHTML='<div class="er" id="vE"></div><div id="vL" style="display:flex;flex-direction:column;gap:8px"></div><div class="add"><input id="vA" placeholder="Label (e.g. API_KEY)" maxlength="120" autocomplete="off" spellcheck="false"><textarea id="vD" placeholder="Value" spellcheck="false"></textarea><button class="pri" id="vS" disabled>Save to Tijori</button></div>';
 const L=m.body.querySelector('#vL'),E=m.body.querySelector('#vE'),A=m.body.querySelector('#vA'),D=m.body.querySelector('#vD'),S=m.body.querySelector('#vS');
 const draw=()=>{E.textContent=err;
  if(loading){L.innerHTML='<div class="em">Loading…</div>';return}
  if(!list.length){L.innerHTML='<div class="em">No secrets yet. Add one below.</div>';return}
  L.innerHTML=list.map((e,i)=>{const k=kid(e,i);
   if(edit===k)return`<div class="sr" data-k="${esc(k)}"><input class="el" value="${esc(e.label)}" maxlength="120"><textarea class="ed" style="margin-top:6px">${esc(e.data)}</textarea><div class="ac"><button data-a="ok">Save</button><button data-a="no">Cancel</button></div></div>`;
   return`<div class="sr" data-k="${esc(k)}"><b>${esc(e.label)}</b><div class="v">${shown.has(k)?esc(e.data):'•'.repeat(Math.min(24,e.data.length))}</div><div class="ac"><button data-a="show">${shown.has(k)?'Hide':'Show'}</button><button data-a="cp">Copy</button><button data-a="ed">Edit</button><button class="dg" data-a="del">Delete</button></div></div>`}).join('')};
 const run=async(fn,msg)=>{try{list=await mutate(fn);edit=null;err='';msg&&toast(msg)}catch(e){err=e.message;toast('Failed: '+e.message)}draw()};
 const find=(l,k)=>l.findIndex((e,i)=>kid(e,i)===k);
 L.onclick=async ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const row=b.closest('.sr'),k=row.dataset.k,i=find(list,k),e=list[i],a=b.dataset.a;
  if(a==='show'){shown.has(k)?shown.delete(k):shown.add(k);draw()}
  else if(a==='cp')copyTxt(e.data);
  else if(a==='ed'){edit=k;draw()}
  else if(a==='no'){edit=null;draw()}
  else if(a==='ok'){const l=row.querySelector('.el').value.trim(),d=row.querySelector('.ed').value.trim();if(!l||!d)return toast('Label and data are required');
   run(x=>{const j=find(x,k);if(j<0)throw Error('Entry no longer exists');x[j]={...x[j],label:l,data:d,ts:Date.now(),id:x[j].id||uuid()};return x},'Updated')}
  else if(a==='del'){if(await dlg({title:'Delete secret?',msg:'"'+e.label+'" will be permanently removed.',ok:'Delete',danger:1}))run(x=>{const j=find(x,k);if(j<0)throw Error('Entry no longer exists');x.splice(j,1);return x},'Deleted')}};
 const chk=()=>S.disabled=!A.value.trim()||!D.value.trim();A.oninput=D.oninput=chk;
 S.onclick=async()=>{const l=A.value.trim(),d=D.value.trim();if(!l||!d)return;S.disabled=true;
  await run(x=>{x.unshift({label:l,data:d,ts:Date.now(),id:uuid()});return x},'Saved "'+l+'"');if(!err){A.value=D.value='';}chk()};
 draw();try{list=await fetchAll()}catch(e){err=e.message}loading=false;draw()}

/* quick-pick: insert secret at caret */
async function pickSecret(s,e){const ta=$$('ta');if(!cur||cur.kind!=='txt')return toast('Open a text file first');
 const o=document.createElement('div');o.className='mdl top';o.innerHTML='<div class="qp"><input placeholder="Select a secret to insert…" spellcheck="false"><div class="ql"><div class="qi mut">Loading…</div></div></div>';document.body.appendChild(o);
 const inp=o.querySelector('input'),ql=o.querySelector('.ql');let items=[],view=[],ix=0;
 const close=()=>{o.remove();ta.focus()};
 const draw=()=>{const q=inp.value.toLowerCase();view=items.filter(x=>x.label.toLowerCase().includes(q));ix=Math.min(ix,Math.max(0,view.length-1));
  ql.innerHTML=view.map((x,i)=>`<div class="qi${i===ix?' on':''}" data-i="${i}"><span>${esc(x.label)}</span><em>${x.data.length} chars</em></div>`).join('')||'<div class="qi mut">No matching secrets</div>';
  const a=ql.querySelector('.on');a&&a.scrollIntoView({block:'nearest'})};
 const pick=x=>{if(!x)return;close();rep(s,e,x.data);const p=s+x.data.length;ta.setSelectionRange(p,p);toast('Inserted '+x.label)};
 inp.oninput=()=>{ix=0;draw()};
 inp.onkeydown=ev=>{const n=view.length||1;if(ev.key==='ArrowDown'){ev.preventDefault();ix=(ix+1)%n;draw()}else if(ev.key==='ArrowUp'){ev.preventDefault();ix=(ix-1+n)%n;draw()}else if(ev.key==='Enter'){ev.preventDefault();pick(view[ix])}else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();close()}};
 ql.onclick=ev=>{const i=ev.target.closest('.qi[data-i]');i&&pick(view[i.dataset.i])};o.onmousedown=ev=>{if(ev.target===o)close()};inp.focus();
 try{items=await fetchAll();draw()}catch(er){ql.innerHTML=`<div class="qi mut">${esc(er.message)}</div>`}}

/* editor right-click menu */
$$('ta').addEventListener('contextmenu',ev=>{if(!cur||cur.kind!=='txt')return;ev.preventDefault();closeMenu();
 const ta=$$('ta'),s=ta.selectionStart,e=ta.selectionEnd,has=s!==e,m=document.createElement('div');m.id='cm';
 const sel=()=>{ta.focus();ta.setSelectionRange(s,e)};
 [['Insert secret from Tijori…',()=>pickSecret(s,e)],['Ask AI about '+(has?'selection':'this file')+'…',()=>askAI(has?ta.value.slice(s,e):ta.value)],0,
  ['Cut',()=>{if(has){sel();document.execCommand('cut')}}],['Copy',()=>{if(has){sel();document.execCommand('copy')}}],
  ['Paste',()=>navigator.clipboard.readText().then(t=>rep(s,e,t)).catch(()=>toast('Use Ctrl/⌘ V to paste'))],['Select all',()=>{ta.focus();ta.select()}]]
 .forEach(i=>{if(!i){m.appendChild(document.createElement('hr'));return}const b=document.createElement('button');b.textContent=i[0];b.onclick=()=>{closeMenu();i[1]()};m.appendChild(b)});
 document.body.appendChild(m);m.style.left=Math.max(4,Math.min(ev.clientX,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(4,Math.min(ev.clientY,innerHeight-m.offsetHeight-8))+'px'});

/* ---------------- AI chat (Groq, key rotation) ---------------- */
let kIdx=0;const cool=new Map();
const fatal=m=>Object.assign(Error(m),{fatal:true});
async function groq(messages,onTok,signal){
 const keys=GROQ_KEYS.filter(k=>/^gsk_/.test(k));if(!keys.length)throw fatal('No Groq API keys configured');
 let last=null,tried=0;
 for(let n=0;n<keys.length;n++){const i=(kIdx+n)%keys.length,k=keys[i];if((cool.get(k)||0)>Date.now())continue;tried++;let started=false;
  try{
   const r=await fetch(GROQ_URL,{method:'POST',signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},body:JSON.stringify({model:MODEL,messages,stream:true,temperature:.6,max_tokens:512})});
   if(!r.ok){let msg='';try{msg=(await r.json()).error.message}catch(e){}
    if(r.status===400||r.status===413||r.status===422)throw fatal('Request rejected: '+(msg||r.status));
    cool.set(k,Date.now()+(r.status===429?(+r.headers.get('retry-after')||60)*1000:r.status===401||r.status===403?36e5:15e3));
    last=Error('Key #'+(i+1)+' failed ('+r.status+(msg?': '+msg:'')+')');continue}
   const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]'){kIdx=i;return}
     try{const t=JSON.parse(d).choices[0].delta.content;if(t){started=true;onTok(t)}}catch(e){}}}
   kIdx=i;return;
  }catch(e){if(e.name==='AbortError'||e.fatal||started)throw e;cool.set(k,Date.now()+5e3);last=e}}
 throw last||Error('All API keys are cooling down. Try again in a minute.')}

let chats=[],active=null,view='chat',busy=false,ctl=null,raf2=0;
try{chats=JSON.parse(lsGet('vk_chats')||'[]');if(!Array.isArray(chats))chats=[]}catch(e){chats=[]}
active=lsGet('vk_chat_active');
const saveChats=()=>{chats=chats.slice(0,50);lsSet('vk_chats',JSON.stringify(chats));lsSet('vk_chat_active',active||'')};
const getChat=()=>chats.find(c=>c.id===active);
function newChat(){const c={id:uuid(),title:'New chat',ts:Date.now(),msgs:[]};chats.unshift(c);active=c.id;view='chat';saveChats();return c}

const P=document.createElement('div');P.id='aichat';
P.innerHTML='<div class="aih"><b id="aiT">Chat</b><button id="aiL" title="All chats">☰</button><button id="aiN" title="New chat">＋</button><button id="aiX" title="Hide (chat is kept)">–</button></div><div id="aiB"></div><div class="aiin" id="aiF"><textarea id="aiI" rows="1" placeholder="Message AI…  (Enter to send)"></textarea><button id="aiS" title="Send">↑</button></div>';
document.body.appendChild(P);
const aiB=$$('aiB'),aiI=$$('aiI');
const showPanel=()=>{P.classList.add('on')},hidePanel=()=>P.classList.remove('on');

function md(t){const parts=String(t).split(/```/);return parts.map((p,i)=>{
 if(i%2){const nl=p.indexOf('\n'),code=nl>=0&&/^[\w+#.-]*$/.test(p.slice(0,nl).trim())?p.slice(nl+1):p;return`<pre><button class="cp">Copy</button><code>${esc(code.replace(/\n$/,''))}</code></pre>`}
 return p.trim()?`<p>${esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</p>`:''}).join('')}

function renderBody(){
 const c=getChat();$$('aiT').textContent=view==='list'?'Chats':(c?c.title:'Chat');$$('aiF').style.display=view==='list'?'none':'flex';
 const S=$$('aiS');S.textContent=busy?'■':'↑';S.title=busy?'Stop':'Send';
 if(view==='list'){aiB.innerHTML=chats.length?chats.map(x=>`<div class="cl" data-id="${x.id}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}<br><em>${new Date(x.ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</em></span><button data-del="${x.id}" title="Delete">×</button></div>`).join(''):'<div class="em">No chats yet. Start one below or from the home screen.</div>';return}
 if(!c||!c.msgs.length){aiB.innerHTML='<div class="em">Ask anything. Right-click code in the editor to ask about it.</div>';return}
 aiB.innerHTML=c.msgs.map((m,i)=>`<div class="am ${m.role}">${md(m.content)}${m.err?`<div class="er">${esc(m.err)}</div>`:''}${busy&&i===c.msgs.length-1&&!m.content?'<span style="color:var(--mut)">Thinking…</span>':''}</div>`).join('');
 aiB.scrollTop=aiB.scrollHeight}
const sched=()=>{cancelAnimationFrame(raf2);raf2=requestAnimationFrame(renderBody)};

async function send(text,ctx){text=(text||'').trim();if(!text||busy)return;
 let c=getChat();if(!c)c=newChat();view='chat';
 c.msgs.push({role:'user',content:ctx?text+'\n\n'+ctx:text});if(c.msgs.length===1)c.title=text.slice(0,40);c.ts=Date.now();
 const a={role:'assistant',content:''};c.msgs.push(a);busy=true;ctl=new AbortController();showPanel();renderBody();
 const hist=c.msgs.slice(0,-1).filter(m=>m.content&&!m.err).slice(-20).map(m=>({role:m.role,content:m.content}));
 try{await groq([{role:'system',content:SYS},...hist],t=>{a.content+=t;sched()},ctl.signal)}
 catch(e){if(e.name!=='AbortError')a.err=e.message}
 busy=false;ctl=null;if(!a.content&&!a.err)a.content='(stopped)';
 chats.sort((x,y)=>y.ts-x.ts);saveChats();renderBody()}

function askAI(code){const f=cur?cur.name:'file';dlg({title:'Ask AI',fields:[{k:'q',label:'Question',val:'Explain this code'}],ok:'Ask'}).then(r=>{if(!r||!r.q.trim())return;
 newChat();send(r.q,'File: '+f+'\n```\n'+code.slice(0,8000)+'\n```')})}

$$('aiS').onclick=()=>{if(busy&&ctl)return ctl.abort();const t=aiI.value;aiI.value='';aiI.style.height='';send(t)};
aiI.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();$$('aiS').click()}};
aiI.oninput=()=>{aiI.style.height='auto';aiI.style.height=Math.min(120,aiI.scrollHeight)+'px'};
$$('aiX').onclick=hidePanel;
$$('aiN').onclick=()=>{if(busy)return toast('Wait for the reply to finish');newChat();renderBody();showPanel();aiI.focus()};
$$('aiL').onclick=()=>{view=view==='list'?'chat':'list';renderBody()};
aiB.onclick=ev=>{const cp=ev.target.closest('.cp');if(cp){return copyTxt(cp.nextElementSibling.textContent)}
 const d=ev.target.closest('[data-del]');if(d){ev.stopPropagation();chats=chats.filter(x=>x.id!==d.dataset.del);if(active===d.dataset.del)active=null;saveChats();return renderBody()}
 const r=ev.target.closest('.cl');if(r&&!busy){active=r.dataset.id;view='chat';saveChats();renderBody()}};
const openChats=()=>{view='list';renderBody();showPanel()};

/* ---------------- wiring: sidebar, home screen, palette ---------------- */
{const nav=document.querySelector('.nav'),mk=(id,label,svg,fn)=>{const b=document.createElement('button');b.className='item';b.id=id;b.innerHTML=`<svg viewBox="0 0 16 16">${svg}</svg>${label}`;b.onclick=fn;nav.appendChild(b)};
 mk('bSec','Secrets','<rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.500 7V5a2.500 2.500 0 0 1 5 0v2"/>',openSecrets);
 mk('bChats','Chats','<path d="M2.500 3.500h11v7h-5l-3 2.500v-2.500h-3z"/>',openChats)}
{const p=document.querySelector('#drop p');if(p){const t=document.createElement('textarea');t.id='mq';t.rows=2;t.placeholder='Ask AI anything, or open a folder…';p.replaceWith(t);
 const go=()=>{const v=t.value.trim();if(!v)return $$('fd').click();t.value='';newChat();send(v)};
 $$('bGo').onclick=go;$$('bGo').title='Send / open folder';t.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();go()}}}}
T('Tijori','Open secrets…',openSecrets,'A');
T('Tijori','Insert secret at cursor…',()=>{const ta=$$('ta');pickSecret(ta.selectionStart,ta.selectionEnd)},'A');
T('AI','Open chats',openChats,'A');T('AI','New chat',()=>$$('aiN').click(),'A');
renderBody();if(chats.length&&getChat()===undefined)active=null;
})();
</script>
