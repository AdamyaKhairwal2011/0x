<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0x Loom</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ============================ 1. CSS ============================ -->
<style>
/* ---- tokens ---- */
:root{--bg:#181818;--side:#141414;--card:#1e1e1e;--line:#2a2a2a;--hover:#242424;--sel:#2e2e2e;--tx:#e6e6e6;--mut:#8b8b90;--acc:#ededed;--on-acc:#141414;--blue:#6aa6ff;--err:#ff6b63;--warn:#e5b062;
--k:#d58ef0;--s:#8fd18b;--n:#e5b062;--c:#6e6e74;--f:#7fa6ff;--t:#e5c07b;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:8px}
:root[data-theme=light]{--bg:#fafafa;--side:#f3f3f3;--card:#fff;--line:#e5e5e5;--hover:#ececec;--sel:#e3e3e3;--tx:#1d1d1f;--mut:#76767b;--acc:#161616;--on-acc:#fff;--blue:#2f6fed;--err:#d93025;--warn:#b06000;
--k:#a626a4;--s:#50a14f;--n:#b76b01;--c:#9a9aa0;--f:#4078f2;--t:#c18401}

/* ---- base ---- */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--mut)}
svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}

/* ---- buttons (Cursor-like: flat, ghost by default) ---- */
.btn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;color:var(--tx);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.ghost{color:var(--mut)}.btn.ghost:hover{color:var(--tx)}
.btn.pri{background:var(--acc);color:var(--on-acc);font-weight:500}.btn.pri:hover{opacity:.88;background:var(--acc)}
.btn.line{border:1px solid var(--line)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font:11px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* ---- layout ---- */
#app{display:flex;height:100dvh}
#side{width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;transition:margin .2s}
#side.hide{margin-left:-260px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.logo{font:20px 'Geist Pixel',var(--mono);margin:16px 16px 8px}
.nav{padding:4px 8px;display:flex;flex-direction:column;gap:1px}
.nav .btn{height:30px;width:100%;justify-content:flex-start}
.sec{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.sec span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#filter{margin:2px 8px 6px;width:calc(100% - 16px);display:none}
#tree{flex:1;overflow:auto;padding:0 8px 8px}
.row{display:flex;align-items:center;gap:7px;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;user-select:none;height:26px}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row span{overflow:hidden;text-overflow:ellipsis;flex:1}
.row svg{color:var(--mut);width:14px;height:14px}
.row .chev{width:11px;height:11px;transition:transform .12s}.row.open .chev{transform:rotate(90deg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.sfoot{border-top:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:1px}

/* ---- top bar + tabs ---- */
#top{display:flex;align-items:center;height:38px;padding:0 6px;gap:2px;border-bottom:1px solid var(--line);flex:none}
#tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;height:100%}
.tab{display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;color:var(--mut);white-space:nowrap;cursor:pointer;border-right:1px solid var(--line);height:100%}
.tab:hover{background:var(--hover)}.tab.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 1px var(--acc)}
.tab i{font-style:normal;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;font-size:14px}
.tab i:hover{background:var(--line)}

/* ---- editor ---- */
#ed{flex:1;min-height:0;position:relative;display:none}
#gut{position:absolute;left:0;top:0;bottom:0;width:52px;overflow:hidden;color:var(--mut);text-align:right;padding:12px 12px 0 0;font:12.5px/20px var(--mono);user-select:none;opacity:.6}
.code{position:absolute;left:52px;right:0;top:0;bottom:0;margin:0;padding:12px 16px 40px 8px;font:12.5px/20px var(--mono);white-space:pre;tab-size:2;overflow:auto;border:0;border-radius:0;outline:none;width:auto;background:none}
#hl{pointer-events:none;overflow:hidden}
#ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--acc);resize:none}
#ta::selection{background:rgba(120,150,255,.3);-webkit-text-fill-color:transparent}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-selector-tag{color:var(--k)}
.hljs-string,.hljs-regexp{color:var(--s)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--n)}
.hljs-comment,.hljs-quote{color:var(--c);font-style:italic}
.hljs-title,.hljs-function,.hljs-section{color:var(--f)}
.hljs-attr,.hljs-attribute,.hljs-name,.hljs-type,.hljs-variable,.hljs-property{color:var(--t)}
#sug{position:absolute;display:none;min-width:170px;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:3px;z-index:8;font:12.5px var(--mono)}
#sug div{padding:3px 8px;border-radius:5px;cursor:pointer}#sug .on{background:var(--sel)}
#status{display:none;align-items:center;gap:16px;height:26px;padding:0 14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;flex:none}
#status .sp{flex:1}
#media{position:absolute;inset:38px 0 26px 0;display:none;place-items:center;padding:20px;overflow:auto}
#media img,#media video{max-width:100%;max-height:100%;border-radius:8px}

/* ---- welcome ---- */
#welcome{position:absolute;inset:38px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.greet{font-size:32px;font-weight:500;letter-spacing:-.5px;display:flex;gap:10px}
.greet b{font:400 32px 'Geist Pixel',var(--mono)}
.box{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .2s}
.box.drag{border-color:var(--acc)}
#ask{border:0;background:none;resize:none;min-height:44px;padding:0;font-size:15px;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:10px;color:var(--mut)}
.go{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips .btn{border:1px solid var(--line);border-radius:999px;color:var(--mut);height:30px;padding:0 14px}.chips .btn:hover{color:var(--tx)}

/* ---- console, preview, AI panel ---- */
#cons{display:none;flex-direction:column;height:200px;flex:none;border-top:1px solid var(--line);background:var(--side)}
#cons .hd{display:flex;align-items:center;gap:6px;padding:4px 10px;color:var(--mut);font-size:12px}#cons .hd b{color:var(--tx);font-weight:500;flex:1}
#cout{flex:1;overflow:auto;padding:0 14px 10px;font:12.5px/19px var(--mono);white-space:pre-wrap;word-break:break-word}
.l.err{color:var(--err)}.l.warn{color:var(--warn)}.l.mut{color:var(--mut)}
.panel{display:none;flex-direction:column;border-left:1px solid var(--line);background:var(--side);flex:none}
.panel.on{display:flex}
.ph{display:flex;align-items:center;gap:4px;height:38px;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}.ph b{font-weight:500;flex:1}
#prev{width:44%;min-width:300px}#prev iframe{flex:1;border:0;background:#fff}
#aip{width:380px;max-width:60vw}
#aib{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:96%;padding:8px 11px;border-radius:12px;word-break:break-word;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--acc);color:var(--on-acc)}.msg.model{align-self:flex-start;background:var(--hover)}
.msg p{margin:0 0 6px}.msg pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;margin:6px 0;font:12px/1.5 var(--mono)}
.edit{border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:8px 0;overflow:hidden}
.edit .eh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px}
.edit pre{margin:0;border:0;max-height:180px}.edit .rm{color:var(--err)}.edit .ad{color:var(--s)}
.aif{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}.aif textarea{resize:none;max-height:120px}
.muted{color:var(--mut);font-size:12px}.er{color:var(--err);font-size:12.5px}

/* ---- modals, menus, toast ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:40}.ov.top{place-items:start center;padding-top:12vh}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.35);width:min(480px,94vw);max-height:86dvh;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;font-weight:600;font-size:14px}
.mb{overflow:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:9px}
.mb label{display:block;color:var(--mut);font-size:12px}.mb label input{margin-top:4px}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg)}
.card .v{color:var(--mut);font:12px var(--mono);word-break:break-all;margin:3px 0}
.card .ac{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid2 .btn{border:1px solid var(--line);height:36px}
.pi{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;cursor:pointer}.pi.on{background:var(--sel)}.pi em{font-style:normal;color:var(--mut);font-size:12px}
#cm{position:fixed;z-index:50;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#cm button{display:block;width:100%;text-align:left;padding:5px 10px;border-radius:5px}#cm button:hover{background:var(--hover)}#cm .danger{color:var(--err)}
#toast{position:fixed;bottom:40px;left:50%;transform:translate(-50%,16px);background:var(--acc);color:var(--on-acc);padding:7px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:14}

/* ---- responsive ---- */
@media(max-width:900px){
 #side{position:absolute;height:100%;z-index:15;width:min(300px,86vw)}#side.hide{margin-left:-310px}
 #prev,#aip{position:absolute;inset:0;width:100%;max-width:none;z-index:12}
 #scrim.on{display:block}
}
@media(max-width:700px){#ta,#hl,#gut{font-size:14px}.greet,.greet b{font-size:24px}textarea,input{font-size:16px}}
</style>
</head>

<script>
/* ======================================================================
   0. CONFIG  (no secrets live here: Gemini keys come from Tijori)
   ====================================================================== */
const CONFIG = {
  pythonBackend: 'https://adamyakhairwal2011-vasuki-cloud.hf.space',
  tijoriModule:  'https://cdn.jsdelivr.net/npm/vasuki-tijori/+esm',
  geminiKeyNames: ['gemini_key_1','gemini_key_2'],
  geminiBase:    'https://generativelanguage.googleapis.com/v1beta/models/',
  defaultModel:  'gemini-3.5-flash-lite',
  supabaseUrl:   'https://aitckloahlwemlekaour.supabase.co',
  supabaseAnon:  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpdGNrbG9haGx3ZW1sZWthb3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyOTQ3MTMsImV4cCI6MjA3MTg3MDcxM30.uQjQLSz0mQuuArPQ_F8u-suQ-6T0e9bF11ahQtSw6yA',
  maxPersistBytes: 4.6e6,
};

/* ======================================================================
   1. UTILITIES
   ====================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  json: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
};
const baseName = p => p.slice(p.lastIndexOf('/') + 1);
const dirOf    = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const extOf    = p => { const n = baseName(p); return n.includes('.') ? n.split('.').pop().toLowerCase() : n.toLowerCase(); };
const normPath = p => { const o = []; for (const s of String(p).replace(/\\/g,'/').split('/')) { const t = s.trim(); if (!t || t === '.') continue; t === '..' ? o.pop() : o.push(t); } return o.join('/'); };
const fmtSize  = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const uuid     = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const pool = async (items, n, fn) => { let i = 0; await Promise.all(Array.from({length: n}, async () => { while (i < items.length) await fn(items[i++]); })); };

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---- modal + dialog (native prompt/confirm are unreliable in sandboxed frames) ---- */
function modal(title, width) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="mc" ${width ? `style="width:${width}"` : ''}><div class="mh"><b>${esc(title)}</b><button class="btn ghost" data-x>×</button></div><div class="mb"></div></div>`;
  document.body.appendChild(ov);
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const close = () => { ov.remove(); removeEventListener('keydown', onKey, true); };
  addEventListener('keydown', onKey, true);
  ov.onmousedown = e => { if (e.target === ov) close(); };
  ov.querySelector('[data-x]').onclick = close;
  return { body: ov.querySelector('.mb'), close, ov };
}
function dialog({ title, msg, fields = [], ok = 'OK', danger = false }) {
  return new Promise(resolve => {
    const m = modal(title);
    m.body.innerHTML = (msg ? `<div class="muted">${esc(msg)}</div>` : '') +
      fields.map((f, i) => `<label>${esc(f.label)}<input data-i="${i}" type="${f.type || 'text'}" value="${esc(f.val || '')}" spellcheck="false"></label>`).join('') +
      `<div class="split" style="justify-content:flex-end"><button class="btn line" data-no>Cancel</button><button class="btn ${danger ? 'pri danger' : 'pri'}" data-ok>${esc(ok)}</button></div>`;
    const inputs = [...m.body.querySelectorAll('input')];
    const done = v => { m.close(); resolve(v); };
    const submit = () => { const r = {}; fields.forEach((f, i) => r[f.key] = inputs[i].value); done(fields.length ? r : true); };
    m.body.querySelector('[data-no]').onclick = () => done(null);
    m.body.querySelector('[data-ok]').onclick = submit;
    m.ov.onmousedown = e => { if (e.target === m.ov) done(null); };

const FENCE = '`'.repeat(3);

const AI_SYSTEM = "You are a coding assistant inside a browser editor. The user's workspace files are provided as context. To propose a change, output edit blocks exactly like this:\n" +
  FENCE + "edit path/to/file.ext\n<<<<<<< SEARCH\nexact existing text (short but unique)\n=======\nreplacement text\n>>>>>>> REPLACE\n" + FENCE +
  "\nLeave SEARCH empty to create a new file. Prefer small targeted edits. Keep explanations brief.";

async function allGeminiKeys() {

async function geminiStream(contents, onToken, signal, onNote) {
  const keys = await allGeminiKeys();
  if (!keys.length) throw Error('No Gemini keys found. Check your Tijori login (⚙) and that gemini_key_1 exists in the vault.');
  let last = null;
  for (let n = 0; n < keys.length; n++) {
    const i = (keyCursor + n) % keys.length, k = keys[i]; if ((keyState.get(k) || 0) > Date.now()) continue;
    let started = false;
    try {
      const r = await fetch(`${CONFIG.geminiBase}${aiModel()}:streamGenerateContent?alt=sse`, { method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': k },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: AI_SYSTEM }] }, contents, generationConfig: { maxOutputTokens: 8192, temperature: .4 } }) });
      if (!r.ok) {
        let msg = ''; try { msg = (await r.json()).error.message; } catch {}
        const badKey = r.status === 401 || r.status === 403 || (r.status === 400 && /api key/i.test(msg));
        if (!badKey && (r.status === 400 || r.status === 404)) throw Object.assign(Error(msg || 'HTTP ' + r.status), { fatal: true });
        keyState.set(k, Date.now() + (badKey ? 36e5 : r.status === 429 ? 6e4 : 15e3));

      }

      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop();
        for (const l of lines) if (l.startsWith('data:')) { try { JSON.parse(l.slice(5)).candidates[0].content.parts.forEach(x => { if (x.text && !x.thought) { started = true; onToken(x.text); } }); } catch {} }
      }
      keyCursor = i; onNote?.(''); return;
    } catch (e) { if (e.name === 'AbortError' || e.fatal || started) throw e; keyState.set(k, Date.now() + 5e3); last = e; }
  }
  throw last || Error('All keys are cooling down — try again in a minute.');
}

P('csv-json', 'CSV ⇄ JSON', 'Convert between CSV, JSON and Markdown tables.', Loom => {
  const parse = t => { const rows = []; let r = [], c = '', q = false; for (let i = 0; i < t.length; i++) { const ch = t[i]; if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; } else if (ch === '"') q = true; else if (ch === ',') { r.push(c); c = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); rows.push(r); r = []; c = ''; } else c += ch; } if (c || r.length) { r.push(c); rows.push(r); } return rows; };
  const cell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  Loom.ui.command('Convert', 'CSV → JSON', () => Loom.editor.transform(t => { const [h, ...b] = parse(t.trim()); return JSON.stringify(b.map(r => Object.fromEntries(h.map((k, i) => [k, r[i] ?? '']))), null, 2); }));
  Loom.ui.command('Convert', 'JSON → CSV', () => Loom.editor.transform(t => { const a = JSON.parse(t), k = [...new Set(a.flatMap(o => Object.keys(o)))]; return [k.map(cell).join(','), ...a.map(o => k.map(x => cell(o[x])).join(','))].join('\n'); }));
  Loom.ui.command('Convert', 'CSV → Markdown table', () => Loom.editor.transform(t => { const [h, ...b] = parse(t.trim()); return ['| ' + h.join(' | ') + ' |', '| ' + h.map(() => '---').join(' | ') + ' |', ...b.map(r => '| ' + h.map((_, i) => r[i] ?? '').join(' | ') + ' |')].join('\n'); }));
}),

P('regex-tester', 'Regex Tester', 'Side panel to try regular expressions against text or the open file.', Loom => {

    const q = s => b.querySelector(s);

P('calculator', 'Inline Calculator', 'Evaluate math in the selection (replace, or append “= result”).', Loom => {

P('todo-scanner', 'TODO Scanner', 'Panel listing every TODO / FIXME / HACK in the workspace.', Loom => {
  const E = Loom.ui.esc; let box;
  const go = async (f, l) => { await Loom.fs.open(f); setTimeout(() => { const ta = Loom.editor.el, ls = ta.value.split('\n'), off = ls.slice(0, l - 1).join('\n').length + (l > 1 ? 1 : 0); ta.focus(); ta.setSelectionRange(off, off + (ls[l - 1] || '').length); ta.scrollTop = Math.max(0, (l - 4) * 20); }, 60); };
  const scan = () => {
    const out = [];
    for (const f of Loom.fs.list()) { const t = Loom.fs.read(f); if (!t) continue; t.split('\n').forEach((ln, i) => { const m = ln.match(/\b(TODO|FIXME|HACK|XXX|BUG)\b[:\s-]*(.*)/); if (m) out.push({ f, l: i + 1, k: m[1], t: m[2].trim() }); }); }
    box.innerHTML = '<button class="btn line" data-r style="margin-bottom:8px">Rescan</button>' + (out.map((x, i) => `<div class="card" data-i="${i}" style="cursor:pointer;margin-bottom:6px"><b>${x.k}</b> ${E(x.t)}<div class="muted">${E(x.f)}:${x.l}</div></div>`).join('') || '<div class="muted">Nothing found 🎉</div>');
    box.onclick = e => { if (e.target.closest('[data-r]')) return scan(); const c = e.target.closest('[data-i]'); if (c) { const x = out[+c.dataset.i]; go(x.f, x.l); } };
  };
  const p = Loom.ui.panel({ title: 'TODOs', render: b => { box = b; b.style.padding = '12px'; scan(); } });
  Loom.ui.command('Tools', 'Scan TODOs', () => { p.open(); scan(); });
}),

P('outline', 'Outline', 'Panel with functions, classes and headings of the open file.', Loom => {
  const E = Loom.ui.esc; let box, timer;
  const RX = { js: /^\s*(?:export\s+)?(?:default\s+)?(?:async\s+)?(?:function\*?\s+([\w$]+)|class\s+([\w$]+)|(?:const|let|var)\s+([\w$]+)\s*=\s*(?:async\s*)?(?:\([^)]*\)|[\w$]+)\s*=>)/, py: /^\s*(?:async\s+)?(?:def|class)\s+(\w+)/, md: /^(#{1,6})\s+(.*)/, css: /^\s*([.#@][^{;]+?)\s*\{/, html: /\bid="([^"]+)"/ };
  RX.ts = RX.jsx = RX.tsx = RX.mjs = RX.js;
  const draw = () => {
    if (!box) return; const f = Loom.fs.current(), ext = f ? f.split('.').pop().toLowerCase() : '', re = RX[ext];
    if (!re) return box.innerHTML = '<div class="muted">No outline for this file type.</div>';
    const items = []; Loom.editor.get().split('\n').forEach((ln, i) => { const m = ln.match(re); if (m) items.push({ l: i + 1, t: ext === 'md' ? m[2] : (m.slice(1).find(Boolean) || ''), d: ext === 'md' ? m[1].length - 1 : 0 }); });
    box.innerHTML = items.map(x => `<div class="row" data-l="${x.l}" style="padding-left:${8 + x.d * 14}px"><span>${E(x.t)}</span><span class="muted">${x.l}</span></div>`).join('') || '<div class="muted">Nothing found.</div>';
  };
  const p = Loom.ui.panel({ title: 'Outline', render: b => { box = b; b.style.padding = '8px'; b.onclick = e => { const r = e.target.closest('[data-l]'); if (!r) return; const l = +r.dataset.l, ta = Loom.editor.el, ls = ta.value.split('\n'), off = ls.slice(0, l - 1).join('\n').length + (l > 1 ? 1 : 0); ta.focus(); ta.setSelectionRange(off, off); ta.scrollTop = Math.max(0, (l - 4) * 20); }; draw(); } });
  Loom.on('file:change', () => { clearTimeout(timer); timer = setTimeout(draw, 400); }); Loom.on('file:open', () => setTimeout(draw, 80));
  Loom.ui.command('View', 'Toggle outline', () => { p.toggle(); draw(); });
}),

P('workspace-grep', 'Search in Files', 'Panel that searches text across every file in the workspace.', Loom => {
  const E = Loom.ui.esc; let box, found = [];
  const go = async (f, l) => { await Loom.fs.open(f); setTimeout(() => { const ta = Loom.editor.el, ls = ta.value.split('\n'), off = ls.slice(0, l - 1).join('\n').length + (l > 1 ? 1 : 0); ta.focus(); ta.setSelectionRange(off, off + (ls[l - 1] || '').length); ta.scrollTop = Math.max(0, (l - 4) * 20); }, 60); };
  const p = Loom.ui.panel({ title: 'Search in Files', render: b => {
    b.style.cssText += ';padding:12px;gap:8px'; b.innerHTML = '<input id="gq" placeholder="Search all files…"><div id="gr"></div>'; box = b.querySelector('#gr');
    b.querySelector('#gq').oninput = e => {
      const q = e.target.value.toLowerCase(); found = []; if (q.length > 1) for (const f of Loom.fs.list()) { const t = Loom.fs.read(f); if (!t) continue; t.split('\n').forEach((ln, i) => { if (found.length < 300 && ln.toLowerCase().includes(q)) found.push({ f, l: i + 1, t: ln.trim().slice(0, 120) }); }); }
      box.innerHTML = found.map((x, i) => `<div class="card" data-i="${i}" style="cursor:pointer;margin-bottom:6px"><code>${E(x.t)}</code><div class="muted">${E(x.f)}:${x.l}</div></div>`).join('') || (q.length > 1 ? '<div class="muted">No results</div>' : '');

P('bookmarks', 'Bookmarks', 'Bookmark lines and jump back to them from a panel.', Loom => {
  const E = Loom.ui.esc; let box;
  const get = () => Loom.store.get('b') || [];
  const cur = () => { const ta = Loom.editor.el; return ta.value.slice(0, ta.selectionStart).split('\n').length; };
  const go = async (f, l) => { await Loom.fs.open(f); setTimeout(() => { const ta = Loom.editor.el, ls = ta.value.split('\n'), off = ls.slice(0, l - 1).join('\n').length + (l > 1 ? 1 : 0); ta.focus(); ta.setSelectionRange(off, off + (ls[l - 1] || '').length); ta.scrollTop = Math.max(0, (l - 4) * 20); }, 60); };
  const draw = () => { if (!box) return; box.innerHTML = get().map((x, i) => `<div class="card split" style="margin-bottom:6px"><span data-g="${i}" style="cursor:pointer"><b>${E(x.p.split('/').pop())}:${x.l}</b><div class="muted">${E(x.t)}</div></span><button class="btn danger" data-d="${i}">×</button></div>`).join('') || '<div class="muted">No bookmarks yet.</div>'; };
  const p = Loom.ui.panel({ title: 'Bookmarks', render: b => { box = b; b.style.padding = '12px'; b.onclick = e => { const g = e.target.closest('[data-g]'), d = e.target.closest('[data-d]'), l = get(); if (g) { const x = l[+g.dataset.g]; go(x.p, x.l); } else if (d) { l.splice(+d.dataset.d, 1); Loom.store.set('b', l); draw(); } }; draw(); } });
  Loom.ui.command('Bookmarks', 'Toggle bookmark at cursor', () => {
    const f = Loom.fs.current(); if (!f) return; const l = cur(), b = get(), i = b.findIndex(x => x.p === f && x.l === l);
    if (i >= 0) b.splice(i, 1); else b.push({ p: f, l, t: (Loom.editor.get().split('\n')[l - 1] || '').trim().slice(0, 60) });

P('pomodoro', 'Pomodoro Timer', 'Focus / break timer in the status bar.', Loom => {
  const s = Loom.ui.statusItem(''); let t = null, end = 0, label = '';
  const f = n => String(n).padStart(2, '0');
  const stop = () => { clearInterval(t); t = null; s.set(''); };
  const tick = () => { const r = Math.max(0, end - Date.now()); s.set('⏱ ' + label + ' ' + f(r / 60000 | 0) + ':' + f(r / 1000 % 60 | 0)); if (!r) { stop(); Loom.ui.toast(label + ' finished!'); } };
  const start = (m, l) => { stop(); label = l; end = Date.now() + m * 60000; t = setInterval(tick, 1000); tick(); };
  Loom.ui.command('Timer', 'Start focus (25 min)', () => start(25, 'Focus')); Loom.ui.command('Timer', 'Start short break (5 min)', () => start(5, 'Break'));
  Loom.ui.command('Timer', 'Start long break (15 min)', () => start(15, 'Long break')); Loom.ui.command('Timer', 'Stop timer', stop);
  return { deactivate: stop };
}),

P('hard-wrap', 'Hard Wrap', 'Wrap long lines at N columns, or unwrap paragraphs.', Loom => {
  const wrap = (line, n) => { if (line.length <= n) return line; const ind = line.match(/^\s*/)[0], out = []; let cur = ''; for (const w of line.trim().split(/\s+/)) { if (cur && (ind + cur + ' ' + w).length > n) { out.push(ind + cur); cur = w; } else cur = cur ? cur + ' ' + w : w; } out.push(ind + cur); return out.join('\n'); };
  Loom.ui.command('Text', 'Hard wrap at N columns…', async () => { const r = await Loom.ui.dialog({ title: 'Hard wrap', fields: [{ key: 'n', label: 'Columns', val: '80' }], ok: 'Wrap' }); if (!r) return; const n = Math.max(20, +r.n || 80); Loom.editor.transform(t => t.split('\n').map(l => wrap(l, n)).join('\n')); });
  Loom.ui.command('Text', 'Unwrap paragraphs', () => Loom.editor.transform(t => t.replace(/([^\n])\n(?!\n)/g, '$1 ')));
}),

P('line-move', 'Move / Duplicate Line', 'Alt+↑/↓ moves the current line, Alt+Shift+↑/↓ duplicates it.', Loom => {
  const ta = Loom.editor.el;
  Loom.editor.onKey(e => {
    if (!e.altKey || e.ctrlKey || e.metaKey || !['ArrowUp', 'ArrowDown'].includes(e.key)) return false;
    const v = ta.value, s = ta.selectionStart, en = ta.selectionEnd, a = s ? v.lastIndexOf('\n', s - 1) + 1 : 0;
    let b = v.indexOf('\n', en > s && v[en - 1] === '\n' ? en - 1 : en); if (b < 0) b = v.length;
    const block = v.slice(a, b);
    if (e.shiftKey) { Loom.editor.edit(b, b, '\n' + block, e.key === 'ArrowDown' ? s + block.length + 1 : s); return true; }
    if (e.key === 'ArrowUp') { if (!a) return true; const pa = a >= 2 ? v.lastIndexOf('\n', a - 2) + 1 : 0, prev = v.slice(pa, a - 1); Loom.editor.edit(pa, b, block + '\n' + prev, s - prev.length - 1); return true; }
    if (b >= v.length) return true;
    let nb = v.indexOf('\n', b + 1); if (nb < 0) nb = v.length; const nx = v.slice(b + 1, nb);
    Loom.editor.edit(a, nb, nx + '\n' + block, s + nx.length + 1); return true;
  });
}),

P('jwt-decoder', 'JWT Decoder', 'Decode a JSON Web Token from the selection.', Loom => {

P('number-bases', 'Number Bases', 'Convert numbers between decimal, hex, binary and octal.', Loom => {
  const D = /\b0x[0-9a-f]+\b|\b0b[01]+\b|\b0o[0-7]+\b|\b\d+\b/gi, val = m => /^0x/i.test(m) ? parseInt(m, 16) : /^0b/i.test(m) ? parseInt(m.slice(2), 2) : /^0o/i.test(m) ? parseInt(m.slice(2), 8) : +m;

  Loom.ui.command('Numbers', 'To hex', () => Loom.editor.transform(t => t.replace(D, m => '0x' + val(m).toString(16))));
  Loom.ui.command('Numbers', 'To binary', () => Loom.editor.transform(t => t.replace(D, m => '0b' + val(m).toString(2))));
  Loom.ui.command('Numbers', 'To octal', () => Loom.editor.transform(t => t.replace(D, m => '0o' + val(m).toString(8))));

P('file-stats', 'Workspace Stats', 'Panel with file counts and sizes by type.', Loom => {

  const draw = () => {
    const by = {}; let tot = 0; const big = [];
    for (const f of Loom.fs.list()) { const t = Loom.fs.read(f), e = f.includes('.') ? f.split('.').pop().toLowerCase() : '(none)', n = typeof t === 'string' ? t.length : 0; (by[e] ??= { c: 0, s: 0 }); by[e].c++; by[e].s += n; tot += n; big.push([f, n]); }
    const rows = Object.entries(by).sort((a, b) => b[1].s - a[1].s), top = big.sort((a, b) => b[1] - a[1]).slice(0, 8);
    box.innerHTML = '<div class="muted">' + Loom.fs.list().length + ' files · ' + (tot / 1024).toFixed(1) + ' KB of text</div><table style="width:100%;margin:8px 0;border-collapse:collapse">' + rows.map(([e, v]) => `<tr><td>.${E(e)}</td><td>${v.c} files</td><td style="text-align:right">${(v.s / 1024).toFixed(1)} KB</td></tr>`).join('') + '</table><b>Largest files</b>' + top.map(([f, n]) => `<div class="muted">${E(f)} — ${(n / 1024).toFixed(1)} KB</div>`).join('');
  };
  const p = Loom.ui.panel({ title: 'Workspace Stats', render: b => { box = b; b.style.padding = '12px'; draw(); } });

P('diff-view', 'Diff View', 'Panel showing your unsaved changes line by line.', Loom => {
  const E = Loom.ui.esc; let box, timer;
  const diff = (a, b) => {
    const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const o = []; let i = 0, j = 0;
    while (i < n && j < m) { if (a[i] === b[j]) { i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) o.push(['-', a[i++]]); else o.push(['+', b[j++]]); }
    while (i < n) o.push(['-', a[i++]]); while (j < m) o.push(['+', b[j++]]); return o;
  };
  const draw = () => {
    if (!box) return; const p = Loom.fs.current(), r = p && Loom.internals.rec(p);
    if (!r || r.kind !== 'txt') return box.innerHTML = '<div class="muted">Open a text file.</div>';
    const a = r.orig.split('\n'), b = r.text.split('\n'); if (a.length > 1500 || b.length > 1500) return box.innerHTML = '<div class="muted">File too large to diff.</div>';
    const d = diff(a, b);
    box.innerHTML = d.length ? '<pre style="margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap">' + d.map(([k, t]) => `<div style="color:var(${k === '-' ? '--err' : '--s'})">${k} ${E(t)}</div>`).join('') + '</pre>' : '<div class="muted">No changes since the file was opened or last downloaded.</div>';
  };
  const p = Loom.ui.panel({ title: 'Changes', render: b => { box = b; b.style.padding = '12px'; draw(); } });
  Loom.on('file:change', () => { clearTimeout(timer); timer = setTimeout(draw, 300); }); Loom.on('file:open', () => setTimeout(draw, 80)); Loom.on('file:save', draw);
  Loom.ui.command('View', 'Toggle diff view', () => { p.toggle(); draw(); });
}),

P('sql-format', 'SQL Formatter', 'Uppercase SQL keywords and break clauses onto lines.', Loom => {
  const KW = 'SELECT FROM WHERE GROUP BY ORDER BY HAVING LIMIT OFFSET JOIN LEFT RIGHT INNER OUTER ON AND OR INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE ALTER DROP AS DISTINCT UNION CASE WHEN THEN ELSE END NULL NOT IN IS LIKE BETWEEN EXISTS ASC DESC'.split(' ');
  const up = t => t.replace(new RegExp('\\b(' + KW.join('|') + ')\\b', 'gi'), m => m.toUpperCase());
  Loom.ui.command('SQL', 'Uppercase keywords', () => Loom.editor.transform(up));
  Loom.ui.command('SQL', 'Format query', () => Loom.editor.transform(t => up(t).replace(/\s+/g, ' ').replace(/\s+(FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|UNION|(?:LEFT |RIGHT |INNER |OUTER )?JOIN)\b/g, '\n$1').trim()));
}),

P('scratchpad', 'Scratchpad', 'A persistent notes panel that survives reloads.', Loom => {
  const p = Loom.ui.panel({ title: 'Scratchpad', render: b => {
    b.style.cssText += ';padding:12px';
    const t = document.createElement('textarea'); t.style.cssText = 'flex:1;resize:none;font:13px/1.5 var(--mono)'; t.placeholder = 'Notes, ideas, links…'; t.value = Loom.store.get('t') || '';
    t.oninput = () => Loom.store.set('t', t.value); b.appendChild(t);
  } });
  Loom.ui.command('View', 'Toggle scratchpad', () => p.toggle());
}),

P('quick-open', 'Quick Open', 'Ctrl/⌘ P fuzzy file switcher.', Loom => {
  const E = Loom.ui.esc;
  const fz = (q, s) => { let i = 0; for (const c of s.toLowerCase()) { if (c === q[i]) i++; if (i === q.length) return true; } return !q.length; };
  const open = () => {
    const m = Loom.ui.modal('Quick open'); m.body.innerHTML = '<input id="qq" placeholder="Type a file name…"><div id="ql"></div>';
    const q = m.body.querySelector('#qq'), l = m.body.querySelector('#ql'); let list = [], ix = 0;
    const draw = () => { const s = q.value.toLowerCase(); list = Loom.fs.list().filter(f => fz(s, f)).sort((a, b) => a.length - b.length).slice(0, 30); ix = Math.min(ix, Math.max(0, list.length - 1)); l.innerHTML = list.map((f, i) => `<div class="pi ${i === ix ? 'on' : ''}" data-i="${i}"><span>${E(f)}</span></div>`).join('') || '<div class="muted">No files</div>'; };
    const go = f => { if (f) { m.close(); Loom.fs.open(f); } };
    q.oninput = () => { ix = 0; draw(); };
    q.onkeydown = e => { if (e.key === 'ArrowDown') { e.preventDefault(); ix = Math.min(ix + 1, list.length - 1); draw(); } else if (e.key === 'ArrowUp') { e.preventDefault(); ix = Math.max(ix - 1, 0); draw(); } else if (e.key === 'Enter') { e.preventDefault(); go(list[ix]); } };
    l.onclick = e => { const d = e.target.closest('[data-i]'); if (d) go(list[+d.dataset.i]); };
    draw(); q.focus();
  };
  const h = e => { if (typeof e.key === 'string' && (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'p') { e.preventDefault(); open(); } };
  document.addEventListener('keydown', h); Loom.ui.command('File', 'Quick open file…', open);
  return { deactivate() { document.removeEventListener('keydown', h); } };
}),

P('tab-tools', 'Tab Tools', 'Close all / other tabs and Ctrl+Alt+←/→ to switch tabs.', Loom => {
  const S = Loom.internals.S, R = () => Loom.eval('renderAll()');
  Loom.ui.command('Tabs', 'Close all tabs', () => { if (S.tabs.some(t => Loom.fs.dirty(t))) return Loom.ui.toast('Unsaved changes — download first'); S.tabs = []; S.cur = null; R(); });
  Loom.ui.command('Tabs', 'Close other tabs', () => { if (!S.cur) return; if (S.tabs.some(t => t !== S.cur && Loom.fs.dirty(t))) return Loom.ui.toast('Other tabs have unsaved changes'); S.tabs = [S.cur]; R(); });
  const mv = d => { if (S.tabs.length < 2) return; Loom.fs.open(S.tabs[(S.tabs.indexOf(S.cur) + d + S.tabs.length) % S.tabs.length]); };
  Loom.ui.command('Tabs', 'Next tab', () => mv(1)); Loom.ui.command('Tabs', 'Previous tab', () => mv(-1));
  const h = e => { if (e.ctrlKey && e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); mv(e.key === 'ArrowRight' ? 1 : -1); } };
  document.addEventListener('keydown', h);
  return { deactivate() { document.removeEventListener('keydown', h); } };
}),

P('open-in-browser', 'Open in Browser', 'Open the bundled HTML page in a new browser tab or copy it.', Loom => {
  const build = async () => { const p = Loom.fs.current(); if (!p || !/\.html?$/i.test(p)) { Loom.ui.toast('Open an HTML file first'); return null; } return (await Loom.eval('bundleHtml')(p, Loom.fs.read(p))).html; };
  Loom.ui.command('Run', 'Open HTML in new tab', async () => { const h = await build(); if (h) window.open(URL.createObjectURL(new Blob([h], { type: 'text/html' })), '_blank'); });
  Loom.ui.command('Run', 'Copy bundled HTML (inline CSS/JS/images)', async () => { const h = await build(); if (h) navigator.clipboard.writeText(h).then(() => Loom.ui.toast('Copied'), () => Loom.ui.toast('Clipboard blocked')); });
}),

P('text-cleanup', 'Text Cleanup', 'Smart quotes, zero-width chars, non-ASCII, final newline.', Loom => {
  Loom.ui.command('Cleanup', 'Replace smart quotes & dashes', () => Loom.editor.transform(t => t.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...')));
  Loom.ui.command('Cleanup', 'Remove zero-width characters', () => Loom.editor.transform(t => t.replace(/[\u200B-\u200D\uFEFF]/g, '')));
  Loom.ui.command('Cleanup', 'Remove non-ASCII characters', () => Loom.editor.transform(t => t.replace(/[^\x00-\x7F]/g, '')));
  Loom.ui.command('Cleanup', 'Ensure single final newline', () => { const t = Loom.editor.get(); const n = t.replace(/\s+$/, '') + '\n'; if (n !== t) Loom.editor.set(n); });
}),

P('debug-helpers', 'Debug Helpers', 'Insert logging for the selection and remove debug lines.', Loom => {
  Loom.ui.command('Debug', 'console.log selection', () => { const s = Loom.editor.selection(); if (s) Loom.editor.insert(s + '\nconsole.log(' + JSON.stringify(s.trim().slice(0, 40)) + ', ' + s.trim().replace(/;$/, '') + ');'); });
  Loom.ui.command('Debug', 'print() selection (Python)', () => { const s = Loom.editor.selection(); if (s) Loom.editor.insert(s + '\nprint(f"{' + s.trim() + ' = }")'); });
  Loom.ui.command('Debug', 'Remove console.log lines', () => Loom.editor.transform(t => t.split('\n').filter(l => !/^\s*console\.(log|debug)\(.*\);?\s*$/.test(l)).join('\n')));
  Loom.ui.command('Debug', 'Remove print() lines', () => Loom.editor.transform(t => t.split('\n').filter(l => !/^\s*print\(.*\)\s*$/.test(l)).join('\n')));
}),
P('code-map', 'Code Map & Citations', 'Index of every function, class and variable in the workspace. Click one to see every reference across all files.', Loom => {
  const E = Loom.ui.esc;
  const KW = new Set('if for while switch catch function return else do try with typeof new delete void await async yield in of constructor super import export default case class const let var'.split(' '));
  const KINDS = ['all', 'function', 'class', 'method', 'const', 'variable', 'css-var', 'id'];
  let syms = new Map(), cache = {}, view = null, rows = [], jumps = [], q = '', kind = 'all', sort = 'name', hideShort = true, timer, B, H, BD, INFO;

  Loom.ui.css('.cmi{cursor:pointer}.cmi:hover{background:var(--hover)}.cmr{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;padding:3px 8px;border-radius:6px}');

  const lang = f => { const e = (f.split('.').pop() || '').toLowerCase(); return e === 'py' ? 'py' : ['css', 'scss'].includes(e) ? 'css' : ['js', 'mjs', 'cjs', 'jsx', 'ts', 'tsx', 'html', 'htm', 'vue', 'svelte'].includes(e) ? 'js' : null; };
  const isCm = (t, lg) => { const s = t.trim(); return lg === 'py' ? s[0] === '#' : /^(\/\/|\/\*|\*)/.test(s); };
  const textFiles = () => Loom.fs.list().filter(f => { const t = Loom.fs.read(f); return typeof t === 'string' && t.length < 2e6; });

  /* ---------- symbol table ---------- */
  const sym = (n, k) => { let s = syms.get(n); if (!s) syms.set(n, s = { name: n, kinds: new Set(), defs: [], dk: new Set(), refs: [] }); if (k) s.kinds.add(k); return s; };
  const def = (n, k, f, l) => { if (!n || KW.has(n)) return; const s = sym(n, k), key = f + ':' + l; if (s.dk.has(key)) return; s.dk.add(key); s.defs.push({ f, l, k }); };

  // extra declarators on one line:  const a = 1, b = 2
  const more = (ln, from, k, f, l) => {
    let d = 0, qt = '';
    for (let i = from; i < ln.length; i++) {
      const c = ln[i];
      if (qt) { if (c === '\\') i++; else if (c === qt) qt = ''; continue; }
      if (c === '"' || c === "'" || c === '`') qt = c;
      else if ('([{'.includes(c)) d++;
      else if (')]}'.includes(c)) { if (--d < 0) break; }
      else if (c === ';' && !d) break;
      else if (c === ',' && !d) { const m = /^\s*([A-Za-z_$][\w$]*)\s*=/.exec(ln.slice(i + 1)); if (m) def(m[1], k, f, l); }
    }
  };
  const scanJs = (ln, f, l) => {
    let m;
    if ((m = /\bfunction\s*\*?\s*([A-Za-z_$][\w$]*)\s*\(/.exec(ln))) def(m[1], 'function', f, l);
    if ((m = /\bclass\s+([A-Za-z_$][\w$]*)/.exec(ln))) def(m[1], 'class', f, l);
    for (const d of ln.matchAll(/\b(const|let|var)\s+([A-Za-z_$][\w$]*)\s*(=\s*(?:async\s*)?(?:function\b|\([^)]*\)\s*=>|[\w$]+\s*=>))?/g)) {
      const base = d[1] === 'const' ? 'const' : 'variable';
      def(d[2], d[3] ? 'function' : base, f, l); more(ln, d.index + d[0].length, base, f, l);
    }
    if ((m = /\b(?:const|let|var)\s*[{[]([^}\]]*)[}\]]\s*=/.exec(ln)))
      m[1].split(',').forEach(x => { x = x.replace(/=.*$/, '').split(':').pop().replace('...', '').trim(); if (/^[A-Za-z_$][\w$]*$/.test(x)) def(x, 'variable', f, l); });
    if ((m = /^\s*(?:static\s+)?(?:async\s+)?(?:get\s+|set\s+)?\*?\s*([A-Za-z_$][\w$]*)\s*\([^()]*\)\s*\{/.exec(ln))) def(m[1], 'method', f, l);
    if ((m = /^\s*([A-Za-z_$][\w$]*)\s*:\s*(?:async\s*)?(?:function\b|\([^)]*\)\s*=>|[\w$]+\s*=>)/.exec(ln))) def(m[1], 'function', f, l);
  };
  const scanPy = (ln, f, l) => {
    let m;
    if ((m = /^\s*(?:async\s+)?def\s+(\w+)/.exec(ln))) def(m[1], 'function', f, l);
    else if ((m = /^\s*class\s+(\w+)/.exec(ln))) def(m[1], 'class', f, l);
    else if ((m = /^\s*([A-Za-z_]\w*)\s*(?::[^=]+)?=(?!=)/.exec(ln))) def(m[1], 'variable', f, l);
  };
  const scanCommon = (ln, f, l, ext) => {
    for (const m of ln.matchAll(/(?:^|[\s{;(])(--[\w-]+)\s*:/g)) def(m[1], 'css-var', f, l);
    if (/^(html?|vue|svelte)$/.test(ext)) for (const m of ln.matchAll(/\bid="([\w-]+)"/g)) def(m[1], 'id', f, l);
  };

  /* ---------- reference pass: one tokenisation of every file ---------- */
  const fill = (targets, files) => {
    const rx = /--[\w-]+|[A-Za-z_$][\w$]*/g;
    for (const f of files) {
      const lg = lang(f) || 'js';
      (cache[f] ||= Loom.fs.read(f).split('\n')).forEach((ln, i) => {
        const l = i + 1, cm = isCm(ln, lg);
        for (const m of ln.matchAll(rx)) {
          const s = targets.get(m[0]); if (!s || s.dk.has(f + ':' + l) || s.refs.length >= 3000) continue;
          const last = s.refs[s.refs.length - 1]; if (last && last.f === f && last.l === l) continue;
          s.refs.push({ f, l, c: m.index, cm });
        }
      });
    }
  };
  const scan = () => {
    syms = new Map(); cache = {};
    const files = textFiles();
    for (const f of files) {
      const lg = lang(f); if (!lg) continue;
      const ext = f.split('.').pop().toLowerCase(), ls = cache[f] = Loom.fs.read(f).split('\n');
      ls.forEach((ln, i) => {
        if (isCm(ln, lg)) return; const l = i + 1;
        if (lg === 'py') scanPy(ln, f, l); else { if (lg === 'js') scanJs(ln, f, l); scanCommon(ln, f, l, ext); }
      });
    }
    fill(syms, files);
    if (INFO) INFO.textContent = syms.size + ' symbols · ' + files.length + ' files';
  };
  const adhoc = name => { const s = { name, kinds: new Set(['text']), defs: [], dk: new Set(), refs: [] }; fill(new Map([[name, s]]), textFiles()); syms.set(name, s); return s; };

  /* ---------- helpers ---------- */
  const go = async (f, l, c = 0, len = 0) => {
    await Loom.fs.open(f);
    setTimeout(() => { const ta = Loom.editor.el, ls = ta.value.split('\n'); let off = 0; for (let i = 0; i < l - 1; i++) off += ls[i].length + 1; off += c; ta.focus(); ta.setSelectionRange(off, off + len); ta.scrollTop = Math.max(0, (l - 6) * 20); }, 80);
  };
  const jmp = (f, l, c, len) => (jumps.push({ f, l, c, len }), jumps.length - 1);
  const snip = (f, l) => (cache[f] && cache[f][l - 1] || '').trim().slice(0, 180);
  const hl = (t, n) => {
    const re = new RegExp('(?<![\\w$])' + n.replace(/[.*+?^${}()|[\]\\-]/g, '\\$&') + (n.startsWith('--') ? '(?![\\w-])' : '(?![\\w$])'), 'g');
    let o = '', last = 0;
    for (const m of t.matchAll(re)) { o += E(t.slice(last, m.index)) + '<mark style="background:var(--sel);color:var(--tx);border-radius:3px;padding:0 2px">' + E(m[0]) + '</mark>'; last = m.index + m[0].length; }
    return o + E(t.slice(last));
  };
  const word = () => {
    const s = Loom.editor.selection().trim(); if (s && !/\s/.test(s)) return s;
    const ta = Loom.editor.el, v = ta.value, i = ta.selectionStart; let a = i, e = i;
    while (a > 0 && /[\w$]/.test(v[a - 1])) a--; while (e < v.length && /[\w$]/.test(v[e])) e++;
    const w = v.slice(a, e); return w && v.slice(a - 2, a) === '--' ? '--' + w : w;
  };

  /* ---------- views ---------- */
  const drawList = () => {
    view = null; jumps = []; H.style.display = 'flex';
    B.querySelector('#cmk').innerHTML = KINDS.map(k => `<button class="btn ${k === kind ? 'pri' : 'line'}" data-k="${k}" style="height:24px;padding:0 10px;font-size:12px">${k}</button>`).join('');
    B.querySelector('[data-s]').textContent = 'Sort: ' + (sort === 'name' ? 'A→Z' : 'most used');
    B.querySelector('[data-h]').textContent = hideShort ? 'Short names: hidden' : 'Short names: shown';
    rows = [...syms.values()].filter(s => (kind === 'all' || s.kinds.has(kind)) && (!q || s.name.toLowerCase().includes(q)) && !(hideShort && s.name.length <= 2 && !s.name.startsWith('--')));
    rows.sort(sort === 'refs' ? (a, b) => b.refs.length - a.refs.length || a.name.localeCompare(b.name) : (a, b) => a.name.localeCompare(b.name));
    BD.innerHTML = rows.slice(0, 400).map((s, i) => `<div class="row" data-n="${i}"><span>${E(s.name)}</span><span class="muted" style="flex:none">${E([...s.kinds][0])} · ${s.refs.length}</span></div>`).join('')
      + (rows.length > 400 ? `<div class="muted" style="padding:8px">Showing 400 of ${rows.length}. Refine the filter.</div>` : '')
      || '<div class="muted" style="padding:8px">No symbols. Open a folder or relax the filters.</div>';
  };
  const detail = name => {
    const s = syms.get(name) || adhoc(name); view = name; jumps = []; H.style.display = 'none';
    const byF = {}; s.refs.forEach(r => (byF[r.f] ||= []).push(r));
    const files = Object.keys(byF).sort(), pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    let h = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><button class="btn line" data-back>← Back</button><b style="word-break:break-all">${E(name)}</b></div>`
      + `<div class="muted" style="margin-bottom:10px">${E([...s.kinds].join(', '))} · ${pl(s.defs.length, 'definition')} · ${pl(s.refs.length, 'reference line')} in ${pl(files.length, 'file')}</div>`;
    if (s.defs.length) h += '<b>Definitions</b>' + s.defs.map(d => {
      const ln = cache[d.f] && cache[d.f][d.l - 1] || '';
      return `<div class="card cmi" data-j="${jmp(d.f, d.l, Math.max(0, ln.indexOf(name)), name.length)}" style="margin:6px 0"><b>${E(d.k)}</b> <span class="muted">${E(d.f)}:${d.l}</span><div class="cmr" style="padding:2px 0">${hl(snip(d.f, d.l), name)}</div></div>`;
    }).join('');
    h += '<div style="margin-top:10px"><b>Citations</b></div>';
    let shown = 0;
    for (const f of files) {
      const items = byF[f].slice(0, Math.max(0, 500 - shown)); shown += items.length; if (!items.length) break;
      h += `<div class="muted" style="margin:8px 0 2px;word-break:break-all">${E(f)} · ${byF[f].length}</div>`
        + items.map(r => `<div class="cmi cmr${r.cm ? ' muted' : ''}" data-j="${jmp(r.f, r.l, r.c, name.length)}"><span class="muted">${r.l}</span>  ${hl(snip(r.f, r.l), name)}</div>`).join('');
    }
    if (s.refs.length > shown) h += `<div class="muted" style="padding:8px">Showing first ${shown} of ${s.refs.length}.</div>`;
    if (!s.refs.length) h += '<div class="muted" style="padding:6px 0">No other references found.</div>';
    BD.innerHTML = h; B.scrollTop = 0;
  };

  const p = Loom.ui.panel({ title: 'Code Map', render: b => {
    B = b; b.style.padding = '12px';
    b.innerHTML = '<div id="cmh" style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px"><input id="cmq" placeholder="Filter functions & variables…"><div id="cmk" style="display:flex;gap:4px;flex-wrap:wrap"></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn line" data-s></button><button class="btn line" data-h></button><button class="btn ghost" data-r>Rescan</button></div><div class="muted" id="cmi"></div></div><div id="cmb"></div>';
    H = b.querySelector('#cmh'); BD = b.querySelector('#cmb'); INFO = b.querySelector('#cmi');
    b.querySelector('#cmq').oninput = e => { q = e.target.value.toLowerCase(); drawList(); };
    b.onclick = e => {
      const t = e.target, j = t.closest('[data-j]'), n = t.closest('[data-n]'), k = t.closest('[data-k]');
      if (j) { const x = jumps[+j.dataset.j]; return go(x.f, x.l, x.c, x.len); }
      if (t.closest('[data-back]')) return drawList();
      if (n) return detail(rows[+n.dataset.n].name);
      if (k) { kind = k.dataset.k; return drawList(); }
      if (t.closest('[data-s]')) { sort = sort === 'name' ? 'refs' : 'name'; return drawList(); }
      if (t.closest('[data-h]')) { hideShort = !hideShort; return drawList(); }
      if (t.closest('[data-r]')) { scan(); return view ? detail(view) : drawList(); }
    };
    drawList();
  } });

  const refresh = () => { const y = B.scrollTop; scan(); view ? detail(view) : drawList(); B.scrollTop = y; };
  const open = () => { p.open(); refresh(); };
  Loom.ui.command('View', 'Code Map: open', open);
  Loom.ui.command('Code Map', 'Find all references of word at cursor', () => { const w = word(); if (!w) return Loom.ui.toast('Put the cursor on a name'); p.open(); scan(); detail(w); });
  Loom.ui.sidebarButton('Code Map', open);
  Loom.editor.onKey(e => { if (e.key === 'F12' && e.shiftKey) { const w = word(); if (w) { p.open(); scan(); detail(w); } return true; } return false; });
  Loom.on('file:change', () => { if (!p.el.classList.contains('on')) return; clearTimeout(timer); timer = setTimeout(refresh, 900); });
  Loom.on('workspace:load', () => { if (p.el.classList.contains('on')) refresh(); });
  return { deactivate() { clearTimeout(timer); } };
}),

];

window.LOOM_PACK = [...THEMES, ...TOOLS];
})();
</script>

.mc{border-radius:24px;border:0;box-shadow:0 12px 48px rgba(0,0,0,.25)}
.mh{padding:18px 20px 8px;font:500 18px "Google Sans",Inter,sans-serif}.mb{padding:8px 20px 20px}
.card{border-radius:16px;background:var(--side)}
input,textarea,select{border-radius:12px}
.msg{border-radius:18px}.msg.model{background:var(--side)}
.edit{border-radius:14px}
#cm,#sug{border-radius:14px}
#toast{border-radius:999px}
.xp{width:380px;max-width:60vw}
.xcard b{font-weight:500}.xcard .muted{margin-top:2px}
@media(max-width:900px){.xp{position:absolute;inset:0;width:100%;max-width:none;z-index:12}}
</style>

<script>
/* =====================================================================
   LOOM EXTENSIONS  — extensions are plain JS: `Loom` (API) and `ext` (meta)
   are in scope, `await` works. Return {deactivate(){}} for custom cleanup.
   Registrations made via Loom.* are removed automatically on disable.
   Optional marketplace table (Supabase SQL):
     create table extensions(id text primary key,name text,version text,
       description text,author text,code text);
     alter table extensions enable row level security;
     create policy rw on extensions for all using(true) with check(true);
   ===================================================================== */
(() => {
const KEY = 'loom_ext_v1', REG = CONFIG.supabaseUrl + '/rest/v1/extensions';
const AF = Object.getPrototypeOf(async function () {}).constructor;
let exts = store.json(KEY, []); const RT = {}, bus = {}, ctxItems = [];
const saveExts = () => store.set(KEY, JSON.stringify(exts));
const on = (e, f) => ((bus[e] ??= new Set).add(f), () => bus[e].delete(f));
const emit = (e, ...a) => (bus[e] || []).forEach(f => { try { f(...a); } catch (x) { console.error('[ext]', e, x); } });
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* wrap any global function: mw(original, ...args). Returns a disposer. */
const wrap = (n, mw) => { const prev = window[n]; let live = true;
  const f = function (...a) { return live ? mw(prev.bind(this), ...a) : prev.apply(this, a); };
  window[n] = f; return () => { live = false; if (window[n] === f) window[n] = prev; }; };

/* core events for every extension */
wrap('openFile', (o, p) => { emit('file:open', p); return o(p); });
wrap('loadWorkspace', async (o, ...a) => { const r = await o(...a); emit('workspace:load'); return r; });
wrap('downloadPath', async (o, ...a) => { const r = await o(...a); emit('file:save', a[0] || S.cur); return r; });
wrap('aiSend', (o, t) => { emit('ai:send', t); return o(t); });
wrap('runCurrent', (o) => { emit('run', S.cur); return o(); });
ta.addEventListener('input', () => emit('file:change', S.cur));
wrap('showMenu', (o, x, y, path, dir) => { o(x, y, path, dir); const m = $('cm'); if (!m) return;
  ctxItems.forEach(c => { if (c.when && !c.when(path, dir)) return; const b = document.createElement('button'); b.textContent = c.label;
    b.onclick = () => { closeMenu(); c.fn(path, dir); }; m.appendChild(b); }); });

/* ---------- the API handed to each extension ---------- */
function make(x, d) {
  const add = f => (d.push(f), f), lsk = k => 'loomx:' + x.id + ':' + k;
  const A = {
    id: x.id, on: (e, f) => add(on(e, f)), emit, wrap: (n, m) => add(wrap(n, m)),
    eval: c => (0, eval)(c),                         // run code in the app's global scope
    internals: { S, rec, ta, CONFIG, COMMANDS, WORDS, store, GH: () => GH, keyState },
    store: { get: k => store.json(lsk(k), null), set: (k, v) => store.set(lsk(k), JSON.stringify(v)) },
    ui: {
      toast, modal, dialog, esc, $,
      css: t => { const s = document.createElement('style'); s.textContent = t; document.head.appendChild(s); add(() => s.remove()); },
      vars: o => { const r = document.documentElement; Object.entries(o).forEach(([k, v]) => r.style.setProperty('--' + k, v)); add(() => Object.keys(o).forEach(k => r.style.removeProperty('--' + k))); },
      command: (g, n, fn) => { const c = [g, n, fn]; COMMANDS.push(c); add(() => { const i = COMMANDS.indexOf(c); if (i >= 0) COMMANDS.splice(i, 1); }); },
      sidebarButton: (label, fn) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.onclick = fn; document.querySelector('.nav').appendChild(b); add(() => b.remove()); return b; },
      topButton: (label, fn) => { const b = document.createElement('button'); b.className = 'btn line'; b.textContent = label; b.onclick = fn; $('top').insertBefore(b, $('bRun')); add(() => b.remove()); return b; },
      statusItem: (t = '') => { const s = document.createElement('span'); s.textContent = t; $('status').insertBefore(s, document.querySelector('#status .sp')); add(() => s.remove()); return { el: s, set: v => s.textContent = v }; },
      contextMenu: (label, fn, when) => { const c = { label, fn, when }; ctxItems.push(c); add(() => { const i = ctxItems.indexOf(c); if (i >= 0) ctxItems.splice(i, 1); }); },
      panel: ({ title = x.name, render, width } = {}) => {
        const el = document.createElement('aside'); el.className = 'panel xp'; if (width) el.style.width = width;
        el.innerHTML = `<div class="ph"><b>${esc(title)}</b><button class="btn ghost" data-x>×</button></div><div class="xpb" style="flex:1;display:flex;flex-direction:column;overflow:auto"></div>`;
        $('app').appendChild(el); const body = el.querySelector('.xpb'); el.querySelector('[data-x]').onclick = () => el.classList.remove('on');
        render && render(body, el); add(() => el.remove());
        return { el, body, open: () => el.classList.add('on'), close: () => el.classList.remove('on'), toggle: () => el.classList.toggle('on') };
      },
      theme: toggleTheme, sidebar: setSidebar,
    },
    editor: {
      get: () => ta.value, set: t => editText(0, ta.value.length, t), selection: () => ta.value.slice(ta.selectionStart, ta.selectionEnd),
      insert: t => editText(ta.selectionStart, ta.selectionEnd, t), replaceSelection: t => editText(ta.selectionStart, ta.selectionEnd, t),
      path: () => S.cur, transform, edit: editText, el: ta,
      addWords: (group, list) => { WORDS[group] = (WORDS[group] || '') + ' ' + list.join(' '); },
      onKey: fn => { const h = e => { if (fn(e)) e.preventDefault(); }; ta.addEventListener('keydown', h); add(() => ta.removeEventListener('keydown', h)); },
    },
    fs: {
      list: () => [...S.files.keys()], dirs: () => [...S.dirs], read: p => rec(normPath(p))?.text, bytes: p => bytesOf(normPath(p)),
      write: async (p, t) => { p = normPath(p); if (rec(p)?.kind === 'txt') rec(p).text = t; else await addFile(p, new File([t], baseName(p))); renderAll(); },
      edit: applyEdit, open: openFile, rename: (a, b) => { movePath(normPath(a), normPath(b)); renderAll(); },
      remove: p => { p = normPath(p); S.files.delete(p); S.tabs = S.tabs.filter(t => t !== p); if (S.cur === p) S.cur = S.tabs[0] || null; renderAll(); },
      mkdir: p => { addDirs(normPath(p)); renderAll(); }, load: loadWorkspace, current: () => S.cur, dirty: isDirty,
    },
    ai: {
      send: aiSend, keys: allGeminiKeys, model: () => aiModel(), setModel: m => store.set('vk_gmodel', m),
      stream: (prompt, onToken, signal) => geminiStream([{ role: 'user', parts: [{ text: prompt }] }], onToken, signal),
      ask: async prompt => { let out = ''; await geminiStream([{ role: 'user', parts: [{ text: prompt }] }], t => out += t); return out; },
      addContext: fn => add(wrap('aiContext', async (o, t) => (await o(t)) + '\n\n' + (await fn(t) || ''))),
      history: () => aiMsgs,
    },
    backend: {
      config: CONFIG, python: async code => (await fetch(CONFIG.pythonBackend + '/run-python', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) })).json(),
      fetch: (...a) => fetch(...a),
      supabase: (path, o = {}) => fetch(CONFIG.supabaseUrl + '/rest/v1/' + path, { ...o, headers: { apikey: CONFIG.supabaseAnon, Authorization: 'Bearer ' + CONFIG.supabaseAnon, 'Content-Type': 'application/json', ...(o.headers || {}) } }).then(r => r.json()),
      vault: { list: vaultList, save: vaultSave }, github: ghApi, tijori: async () => (await import(CONFIG.tijoriModule)).tijori,
      preview: { run: runHtml, transform: fn => add(wrap('bundleHtml', async (o, ...a) => { const r = await o(...a); r.html = (await fn(r.html, a[0])) ?? r.html; return r; })) },
      console: consolePrint,
    },
  };
  return A;
}

/* ---------- lifecycle ---------- */
const load = async x => { if (!x.enabled || RT[x.id]) return; const d = RT[x.id] = [];
  try { const r = await new AF('Loom', 'ext', x.code)(make(x, d), x); if (r && r.deactivate) d.push(r.deactivate); }
  catch (e) { toast(x.name + ': ' + e.message); console.error(e); } };
const unload = id => { (RT[id] || []).reverse().forEach(f => { try { f(); } catch {} }); delete RT[id]; };
const install = async x => { unload(x.id); exts = exts.filter(e => e.id !== x.id).concat({ enabled: true, version: '1.0.0', ...x }); saveExts(); await load(exts.find(e => e.id === x.id)); };
window.Loom = make({ id: 'console', name: 'console' }, []);

/* ---------- built-in marketplace entries (real JS, serialised) ---------- */
const FEATURED = [
  { id: 'word-count', name: 'Word Count', description: 'Live word count in the status bar.', author: 'Loom',
    fn: Loom => { const s = Loom.ui.statusItem(''); const u = () => { const t = (Loom.editor.get() || '').trim(); s.set(t ? t.split(/\s+/).length + ' words' : ''); };
      Loom.on('file:change', u); Loom.on('file:open', () => setTimeout(u, 50)); u(); } },
  { id: 'markdown-preview', name: 'Markdown Preview', description: 'Side panel that renders the open file as Markdown.', author: 'Loom',
    fn: Loom => { const p = Loom.ui.panel({ title: 'Markdown' }); p.body.style.padding = '16px';
      const u = () => { p.body.innerHTML = Loom.ui.esc(Loom.editor.get() || '').replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>'); };
      Loom.on('file:change', u); Loom.on('file:open', () => setTimeout(u, 50)); Loom.ui.command('Markdown', 'Toggle Markdown preview', () => { p.toggle(); u(); }); } },
  { id: 'ai-explain', name: 'AI Explain / Fix', description: 'Right-click files or use ⌘K to ask Gemini about the selection.', author: 'Loom',
    fn: Loom => { const ask = pre => { const t = Loom.editor.selection(); if (!t) return Loom.ui.toast('Select some code first'); Loom.ai.send(pre + '\n\n' + t); };
      Loom.ui.command('AI', 'Explain selection', () => ask('Explain this code briefly:')); Loom.ui.command('AI', 'Fix selection', () => ask('Find bugs in this code and propose fixes as edit blocks:'));
      Loom.ui.contextMenu('Ask AI about this file', p => Loom.ai.send('Review @' + p), (p, dir) => !dir); } },
].map(e => ({ ...e, version: '1.0.0', code: 'return (' + e.fn + ')(Loom, ext)' })).concat(window.LOOM_PACK || []);

const TEMPLATE = `// Loom, ext are in scope. await works.
Loom.ui.command('Hello', 'Say hello', () => Loom.ui.toast('Hello from ' + ext.name));
Loom.on('file:open', p => console.log('opened', p));
// Loom.ui · editor · fs · ai · backend · store · wrap(name, mw) · eval · internals`;

/* ---------- Extensions UI ---------- */
let market = null, draft = null;
async function fetchMarket() { if (market) return market;
  let remote = []; try { const r = await fetch(REG + '?select=id,name,version,description,author,code', { headers: { apikey: CONFIG.supabaseAnon, Authorization: 'Bearer ' + CONFIG.supabaseAnon } }); const j = await r.json(); if (Array.isArray(j)) remote = j; } catch {}
  const ids = new Set(FEATURED.map(f => f.id)); return market = [...FEATURED, ...remote.filter(r => !ids.has(r.id))]; }

function openExt(tab = 'installed') {
  const m = modal('Extensions', 'min(760px,96vw)'), B = m.body;
  const card = (x, btns) => `<div class="card split xcard"><span><b>${esc(x.name)}</b> <span class="muted">v${esc(x.version || '1.0.0')} · ${esc(x.author || 'unknown')}</span><div class="muted">${esc(x.description || '')}</div></span><span class="ac">${btns}</span></div>`;
  const draw = async () => {
    const tabs = ['installed', 'market', 'develop'], names = { installed: 'Installed', market: 'Marketplace', develop: 'Develop' };
    let html = `<div class="grid2" style="grid-template-columns:repeat(3,1fr)">${tabs.map(t => `<button class="btn ${t === tab ? 'pri' : 'line'}" data-t="${t}">${names[t]}</button>`).join('')}</div>`;
    if (tab === 'installed') html += exts.map((x, i) => card(x, `<button class="btn line" data-a="tog" data-i="${i}">${x.enabled ? 'Disable' : 'Enable'}</button><button class="btn" data-a="edit" data-i="${i}">Edit</button><button class="btn" data-a="pub" data-i="${i}">Publish</button><button class="btn danger" data-a="rm" data-i="${i}">Remove</button>`)).join('') || '<div class="muted" style="padding:14px">Nothing installed. Browse the Marketplace or write your own in Develop.</div>';
    if (tab === 'market') { B.innerHTML = html + '<div class="muted" style="padding:14px">Loading…</div>'; const list = await fetchMarket();
      html += '<input id="xq" placeholder="Search extensions…">' + list.map((x, i) => card(x, exts.some(e => e.id === x.id) ? '<span class="muted">Installed</span>' : `<button class="btn pri" data-a="get" data-i="${i}">Install</button>`)).join(''); }
    if (tab === 'develop') { const x = draft || { name: '', description: '', code: TEMPLATE };
      html += `<input id="dn" placeholder="Extension name" value="${esc(x.name)}"><input id="dd" placeholder="Description" value="${esc(x.description || '')}"><textarea id="dc" spellcheck="false" style="min-height:240px;font:12.5px/1.5 var(--mono)">${esc(x.code)}</textarea><div class="split"><span class="muted">Runs with full access to your workspace, vault and GitHub token.</span><button class="btn pri" data-a="save">Install &amp; run</button></div>`; }
    B.innerHTML = html;
    const q = B.querySelector('#xq'); if (q) q.oninput = () => B.querySelectorAll('.xcard').forEach(c => c.style.display = c.textContent.toLowerCase().includes(q.value.toLowerCase()) ? '' : 'none');
  };
  B.onclick = async e => {
    const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; if (tab !== 'develop') draft = null; return draw(); }
    const b = e.target.closest('[data-a]'); if (!b) return; const i = +b.dataset.i, a = b.dataset.a;
    if (a === 'tog') { const x = exts[i]; x.enabled = !x.enabled; saveExts(); x.enabled ? await load(x) : unload(x.id); }
    else if (a === 'rm') { unload(exts[i].id); exts.splice(i, 1); saveExts(); }
    else if (a === 'edit') { draft = exts[i]; tab = 'develop'; }
    else if (a === 'get') { const x = market[i]; if (!await dialog({ title: 'Install ' + x.name + '?', msg: 'Extensions are JavaScript with full access to your files, vault secrets and GitHub token. Only install code you trust.', ok: 'Install' })) return;
      const { fn, ...rest } = x; await install(rest); toast('Installed ' + x.name); }
    else if (a === 'save') { const name = B.querySelector('#dn').value.trim(), code = B.querySelector('#dc').value; if (!name) return toast('Name required');
      try { new AF('Loom', 'ext', code); } catch (er) { return toast('Syntax error: ' + er.message); }
      await install({ id: draft?.id || slug(name) || uuid(), name, description: B.querySelector('#dd').value, author: draft?.author || GH?.user?.login || 'me', version: draft?.version || '1.0.0', code }); draft = null; tab = 'installed'; toast('Extension running'); }
    else if (a === 'pub') { const x = exts[i];
      try { const r = await fetch(REG + '?on_conflict=id', { method: 'POST', headers: { apikey: CONFIG.supabaseAnon, Authorization: 'Bearer ' + CONFIG.supabaseAnon, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ id: x.id, name: x.name, version: x.version, description: x.description, author: x.author, code: x.code }) });
        if (!r.ok) throw Error('Registry returned ' + r.status + ' (create the `extensions` table, see patch header)'); market = null; toast('Published to marketplace'); } catch (er) { toast(er.message); } return; }
    draw();
  };
  draw();
}

/* ---------- wire into the app ---------- */
const nb = document.createElement('button'); nb.className = 'btn';
nb.innerHTML = '<svg viewBox="0 0 16 16"><path d="M6 2h4v3h3v4h-3v3H6V9H3V5h3z"/></svg>Extensions'; nb.onclick = () => openExt();
document.querySelector('.nav').appendChild(nb);
COMMANDS.push(['Tools', 'Extensions…', () => openExt()], ['Tools', 'Extension marketplace…', () => openExt('market')], ['Tools', 'New extension…', () => { draft = null; openExt('develop'); }]);
exts.forEach(load);
})();
</script>
