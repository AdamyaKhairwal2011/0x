}
const discardOk = async () => !dirty || await dialog({ title: 'Discard unsaved changes?', msg: 'The current shell has changes that were not saved.', ok: 'Discard', danger: true });
async function loadNb(json, name) {
  if (!await discardOk()) return false;
  NB = fromNb(json, name); counter = 0; dirty = false; render(true); saveDraft(); toast('Opened ' + NB.name + '.ipynb'); return true;
}
function openDlg() {
  const m = modal('Open notebook', 'min(640px,96vw)'), g = s => q(s, m.body);
  m.body.innerHTML = `<div class="split"><button class="btn line" id="opD">Upload from device…</button><span class="muted">.ipynb files</span></div><input type="file" id="opF" accept=".ipynb,application/json" hidden>
  <div class="muted">Browser</div><div id="opL" style="display:flex;flex-direction:column;gap:6px"></div><div class="muted">GitHub · 0x_shells</div><div id="opG" style="display:flex;flex-direction:column;gap:6px"><div class="muted">Loading…</div></div><div class="er" id="opE"></div>`;
  const err = t => g('#opE').textContent = t;
  g('#opD').onclick = () => g('#opF').click();
  g('#opF').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { if (await loadNb(await f.text(), f.name)) m.close(); } catch (er) { err(er.message); } e.target.value = ''; };
  const drawLocal = () => { const map = store.json('vk_shells', {}), names = Object.keys(map).sort((a, b) => map[b].ts - map[a].ts);
    g('#opL').innerHTML = names.map(n => `<div class="card split"><span><b>${esc(n)}.ipynb</b><div class="muted">${new Date(map[n].ts).toLocaleString()}</div></span><span class="ac"><button class="btn pri" data-l="${esc(n)}">Open</button><button class="btn danger" data-x="${esc(n)}">Delete</button></span></div>`).join('') || '<div class="muted">No notebooks saved in this browser.</div>'; };
  drawLocal();
  g('#opL').onclick = async e => {
    const o = e.target.closest('[data-l]'), x = e.target.closest('[data-x]'), map = store.json('vk_shells', {});
    if (o) { try { if (await loadNb(map[o.dataset.l].data, o.dataset.l)) m.close(); } catch (er) { err(er.message); } }
    else if (x && await dialog({ title: 'Delete from browser?', msg: x.dataset.x + '.ipynb', ok: 'Delete', danger: true })) { delete map[x.dataset.x]; localStorage.setItem('vk_shells', JSON.stringify(map)); drawLocal(); }
  };
  (async () => {
    const box = g('#opG'); if (!GH || !GH.token) { box.innerHTML = '<button class="btn line" id="opC" style="align-self:flex-start">Connect GitHub</button>'; g('#opC').onclick = () => { m.close(); ghConnect(); }; return; }
    try {
      let list = []; try { list = (await ghApi(`/repos/${GH.user.login}/0x_shells/contents`)).filter(f => f.type === 'file' && /\.ipynb$/i.test(f.name)); } catch (e) { if (e.status !== 404) throw e; }
      box.innerHTML = list.map((f, i) => `<div class="card split"><span><b>${esc(f.name)}</b><div class="muted">${(f.size / 1024).toFixed(1)} KB</div></span><button class="btn pri" data-i="${i}">Open</button></div>`).join('') || '<div class="muted">No notebooks in 0x_shells yet. Save one with “Publish to GitHub”.</div>';
      box.onclick = async e => { const b = e.target.closest('[data-i]'); if (!b) return; b.disabled = true; const f = list[+b.dataset.i];
        try { const j = await ghApi(`/repos/${GH.user.login}/0x_shells/git/blobs/${f.sha}`); if (await loadNb(new TextDecoder().decode(b64ToBytes(j.content)), f.name)) m.close(); } catch (er) { err(er.message); } b.disabled = false; };
    } catch (e) { box.innerHTML = `<div class="er">${esc(e.message)}</div>`; }
  })();
}
async function newNb() { if (!await discardOk()) return; NB = blank(); counter = 0; dirty = false; render(true); saveDraft(); }

async function askAi() {
  const r = await dialog({ title: 'Ask AI to write code', fields: [{ key: 'p', label: 'What should the new code cell do?' }], ok: 'Generate' }); if (!r || !r.p.trim()) return;
  const t0 = performance.now(); toast('Gemini is thinking…');
  try {
    if (!window.Loom || !Loom.ai) throw Error('AI is not ready yet'); let t = await Loom.ai.ask('Write Python code for one notebook cell. Reply with only the code inside one ```python block.\nTask: ' + r.p);
    const m = t.match(/```(?:python|py)?\n([\s\S]*?)```/); t = (m ? m[1] : t).trim(); addCell('code', NB.sel + 1, false, t); toast('Gemini replied in ' + fmt(performance.now() - t0));

}
